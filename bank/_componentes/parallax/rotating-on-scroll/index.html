<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating On-Scroll Animations</title>
    
    <!-- Premium Fonts to match Codrops aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Variables */
        :root {
            --bg-color: #0c0c0c;
            --text-color: #f0f0f0;
            --accent-color: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle Noise Texture Overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .hero__title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3rem, 8vw, 8rem);
            line-height: 1;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 1rem;
            will-change: transform, opacity;
        }

        .hero__subtitle {
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            color: var(--accent-color);
            font-weight: 300;
            will-change: transform, opacity;
        }

        /* Gallery Grid Layout */
        .gallery-container {
            padding: 10vw 5vw;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10vw 5vw;
        }

        /* Staggered masonry effect */
        .gallery__item:nth-child(even) {
            margin-top: 25vh;
        }

        /* 3D Perspective Setup */
        .gallery__item {
            perspective: 1200px; /* Crucial for 3D depth */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gallery__item-inner {
            position: relative;
            width: 100%;
            max-width: 500px;
            transform-style: preserve-3d; /* Allows nested elements to share 3D space */
            will-change: transform, opacity;
            border-radius: 12px;
            /* Hide overflow to clip scaled images, creating a clean frame */
            overflow: hidden; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .gallery__item-img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            transform-origin: center;
            will-change: transform;
        }

        .gallery__item-caption {
            margin-top: 1.5rem;
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            opacity: 0; /* Animated via JS */
        }

        /* Footer */
        .footer {
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Syne', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            text-transform: uppercase;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
                gap: 15vh 0;
            }
            .gallery__item:nth-child(even) {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>

    <!-- UI Overlay elements -->
    <div class="noise"></div>

    <!-- Main Content -->
    <main>
        <header class="hero">
            <h1 class="hero__title">Rotating<br>On-Scroll</h1>
            <p class="hero__subtitle">3D Scroll Animation Experiment</p>
        </header>

        <section class="gallery-container">
            <div class="gallery">
                <!-- Item 1 -->
                <figure class="gallery__item">
                    <div class="gallery__item-inner">
                        <img class="gallery__item-img" src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1000&auto=format&fit=crop" alt="Fashion model">
                    </div>
                    <figcaption class="gallery__item-caption">Haruto Saito</figcaption>
                </figure>
                
                <!-- Item 2 -->
                <figure class="gallery__item">
                    <div class="gallery__item-inner">
                        <img class="gallery__item-img" src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=1000&auto=format&fit=crop" alt="Portrait">
                    </div>
                    <figcaption class="gallery__item-caption">Yuna Mori</figcaption>
                </figure>

                <!-- Item 3 -->
                <figure class="gallery__item">
                    <div class="gallery__item-inner">
                        <img class="gallery__item-img" src="https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=1000&auto=format&fit=crop" alt="Fashion photography">
                    </div>
                    <figcaption class="gallery__item-caption">Itsuki Hayashi</figcaption>
                </figure>

                <!-- Item 4 -->
                <figure class="gallery__item">
                    <div class="gallery__item-inner">
                        <img class="gallery__item-img" src="https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1000&auto=format&fit=crop" alt="Creative portrait">
                    </div>
                    <figcaption class="gallery__item-caption">Akari Shimizu</figcaption>
                </figure>

                <!-- Item 5 -->
                <figure class="gallery__item">
                    <div class="gallery__item-inner">
                        <img class="gallery__item-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1000&auto=format&fit=crop" alt="Studio portrait">
                    </div>
                    <figcaption class="gallery__item-caption">Sota Okada</figcaption>
                </figure>

                <!-- Item 6 -->
                <figure class="gallery__item">
                    <div class="gallery__item-inner">
                        <img class="gallery__item-img" src="https://images.unsplash.com/photo-1506152983158-b4a74a01c721?q=80&w=1000&auto=format&fit=crop" alt="Outdoor fashion">
                    </div>
                    <figcaption class="gallery__item-caption">Rin Kagawa</figcaption>
                </figure>
            </div>
        </section>

        <footer class="footer">
            <p>Fin.</p>
        </footer>
    </main>

    <!-- Dependencies -->
    <!-- Lenis for smooth scrolling -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <!-- GSAP Core & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        // 1. Initialize Lenis (Smooth Scroll)
        const lenis = new Lenis({
            lerp: 0.08, 
            smoothWheel: true,
        });

        // Integrate Lenis with GSAP ScrollTrigger
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time)=>{
            lenis.raf(time * 1000);
        });
        gsap.ticker.lagSmoothing(0);

        // Register GSAP Plugin
        gsap.registerPlugin(ScrollTrigger);

        // 2. Initial Load Animation
        const tl = gsap.timeline();
        tl.from('.hero__title', {
            y: 100,
            rotationX: -45,
            opacity: 0,
            duration: 1.5,
            ease: "power4.out",
            transformOrigin: "center bottom",
            delay: 0.2
        })
        .from('.hero__subtitle', {
            y: 30,
            opacity: 0,
            duration: 1.2,
            ease: "power3.out"
        }, "-=1.0");

        // 3. Setup Rotating On-Scroll Animations for Gallery items
        const galleryItems = document.querySelectorAll('.gallery__item');

        galleryItems.forEach((item, index) => {
            const inner = item.querySelector('.gallery__item-inner');
            const img = item.querySelector('.gallery__item-img');
            const caption = item.querySelector('.gallery__item-caption');
            
            // Alternate rotation direction based on column (odd vs even)
            const isEven = index % 2 !== 0; 
            const direction = isEven ? 1 : -1;

            // THE SOLUTION: Create a single timeline for the item's entire lifecycle on screen
            const itemTl = gsap.timeline({
                scrollTrigger: {
                    trigger: item,
                    start: "top bottom", // Starts when item top enters from bottom
                    end: "bottom top",   // Ends when item bottom leaves through top
                    scrub: 1.5,          // Extra smoothness on scrub
                }
            });

            // -- Phase 1: Enter (0% to 50% of timeline) -> Comes from deep and focuses in center
            itemTl.fromTo(inner, {
                rotationX: 55,
                rotationY: 30 * direction,
                rotationZ: 15 * direction,
                z: -800, 
                y: 250,
                opacity: 0
            }, {
                rotationX: 0,
                rotationY: 0,
                rotationZ: 0,
                z: 0,
                y: 0,
                opacity: 1,
                ease: "none", // Let scroll dictate speed
            })
            // -- Phase 2: Exit (50% to 100% of timeline) -> Flees to the top
            .to(inner, {
                rotationX: -55,
                rotationY: -30 * direction,
                rotationZ: -15 * direction,
                z: -800,
                y: -250,
                opacity: 0,
                ease: "none",
            });

            // -- Image Scale Parallax
            gsap.fromTo(img, {
                scale: 1.4
            }, {
                scale: 1,
                ease: "none",
                scrollTrigger: {
                    trigger: item,
                    start: "top bottom",
                    end: "bottom top",
                    scrub: true
                }
            });

            // -- Reveal Caption only in the center of the screen
            gsap.fromTo(caption, {
                y: 30,
                opacity: 0
            }, {
                y: 0,
                opacity: 1,
                duration: 0.5,
                scrollTrigger: {
                    trigger: item,
                    start: "top 60%",
                    end: "bottom 40%",
                    toggleActions: "play reverse play reverse", 
                }
            });
        });
    </script>
</body>
</html>
