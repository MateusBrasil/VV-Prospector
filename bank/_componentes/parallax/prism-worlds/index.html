<!DOCTYPE html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Image Entrance Animation | Prism Worlds</title>
    <meta name="description" content="A circular stack intro animation for images." />
    <meta name="keywords" content="gsap, animation, intro, stack, images, 3d" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet" />

    <style>
      *,
      *::after,
      *::before {
        box-sizing: border-box;
      }

      :root {
        font-size: 16px;
        --color-text: #111;
        --color-bg: #e3efed;
        --color-bg-alt: #8ca9af;
        --color-link: rgba(0,0,0,0.6);
        --color-link-hover: #000;
        --page-padding: 1.5rem;
        --color-title: #000;
      }

      body {
        margin: 0;
        color: var(--color-text);
        background-color: var(--color-bg);
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
        height: 100vh;
        /* Dynamic SVG noise background texture */
        background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.08"/%3E%3C/svg%3E'), 
                    radial-gradient(circle, var(--color-bg) 0%, var(--color-bg-alt) 100%);
        background-size: 150px, 100% 100vh;
      }

      /* Page Loader */
      .js .loading::before,
      .js .loading::after {
        content: "";
        position: fixed;
        z-index: 1000;
      }

      .js .loading::before {
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--color-bg);
      }

      .js .loading::after {
        top: 50%;
        left: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border-radius: 50%;
        opacity: 0.4;
        background: var(--color-link-hover);
        animation: loaderAnim 0.7s linear infinite alternate forwards;
      }

      @keyframes loaderAnim {
        to {
          opacity: 1;
          transform: scale3d(0.5, 0.5, 1);
        }
      }

      .frame {
        padding: var(--page-padding);
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        width: 100%;
        pointer-events: none;
      }

      .frame__title {
        font-size: 12px;
        text-transform: uppercase;
        margin: 0;
        letter-spacing: 0.05em;
        opacity: 0.8;
      }

      .content {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
        position: absolute;
        left: 0;
        top: 0;
      }

      .gloock-regular {
        font-family: "Gloock", serif;
        font-weight: 400;
        font-style: normal;
      }

      .scene {
        perspective: 1000px;
        overflow: hidden;
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        left: 0;
        top: 0;
      }

      .card {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .card__img {
        width: 5em;
        border-radius: 5px;
        aspect-ratio: 2/3;
        background-position: center;
        background-size: cover;
      }

      .headings {
        text-align: center;
        position: relative;
        z-index: 10;
        color: var(--color-title);
        text-transform: uppercase;
      }

      .headings__main {
        line-height: 0.5;
        font-size: clamp(2.5rem, 1.59rem + 3.883vw, 6.25rem);
      }

      .headings_subtitle {
        line-height: 0.5;
        font-size: clamp(1rem, 0.757rem + 1.036vw, 2rem);
        margin-top: 1rem;
        letter-spacing: 0.1em;
      }

      @media screen and (min-width: 53em) {
        .card__img {
          width: 6em;
        }
      }
    </style>

    <script>
      document.documentElement.className = "js";
    </script>
  </head>
  <body class="demo-1 loading">
    <main>
      <header class="frame">
        <h1 class="frame__title">3D Image Transition System</h1>
      </header>
      <div class="content">
        <div class="scene">
          <div class="group">
            <div class="card">
              <div class="card__img" style="background-image: url(https://picsum.photos/seed/p1/400/600)"></div>
            </div>
            <div class="card">
              <div class="card__img" style="background-image: url(https://picsum.photos/seed/p2/400/600)"></div>
            </div>
            <div class="card">
              <div class="card__img" style="background-image: url(https://picsum.photos/seed/p3/400/600)"></div>
            </div>
            <div class="card">
              <div class="card__img" style="background-image: url(https://picsum.photos/seed/p4/400/600)"></div>
            </div>
            <div class="card">
              <div class="card__img" style="background-image: url(https://picsum.photos/seed/p5/400/600)"></div>
            </div>
            <div class="card">
              <div class="card__img" style="background-image: url(https://picsum.photos/seed/p6/400/600)"></div>
            </div>
            <div class="card">
              <div class="card__img" style="background-image: url(https://picsum.photos/seed/p7/400/600)"></div>
            </div>
            <div class="card">
              <div class="card__img" style="background-image: url(https://picsum.photos/seed/p8/400/600)"></div>
            </div>
          </div>
        </div>

        <div class="headings">
          <h1 class="headings__main gloock-regular">Prism</h1>
          <h1 class="headings__main gloock-regular">Worlds</h1>
          <h5 class="headings_subtitle gloock-regular">A Multidimensional Journey</h5>
        </div>
      </div>
    </main>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    
    <!-- Animation Logic -->
    <script>
      // Setup image preloading functionality
      const preloadImages = (selector = 'img') => {
        return new Promise((resolve) => {
          imagesLoaded(document.querySelectorAll(selector), {background: true}, resolve);
        });
      };

      // Initialize the 3D entry animation
      const init = () => {
        const breakPoint = "53em";
        const mm = gsap.matchMedia();

        mm.add(
          {
            isDesktop: `(min-width: ${breakPoint})`,
            isMobile: `(max-width: ${breakPoint})`,
          },
          (context) => {
            let { isDesktop } = context.conditions;

            const image = document.querySelector(".card__img");
            const cardList = gsap.utils.toArray(".card");
            const count = cardList.length;
            const sliceAngle = (2 * Math.PI) / count;

            // Distance from image center to screen center
            const radius1 = 50 + image.clientHeight / 2;
            const radius2 = isDesktop ? 250 - radius1 : 180 - radius1;

            gsap
              .timeline()
              .from(cardList, {
                y: window.innerHeight / 2 + image.clientHeight * 1.5,
                rotateX: -180,
                stagger: 0.1,
                duration: 0.5,
                opacity: 0.8,
                scale: 3,
              })
              .set(cardList, {
                transformOrigin: `center ${radius1 + image.clientHeight / 2}px`,
              })
              .set(".group", {
                transformStyle: "preserve-3d",
              })
              .to(cardList, {
                y: -radius1,
                duration: 0.5,
                ease: "power1.out",
              })
              .to(
                cardList,
                {
                  rotation: (index) => {
                    return (index * 360) / count;
                  },
                  rotateY: 15,
                  duration: 1,
                  ease: "power1.out",
                },
                "<"
              )
              .to(cardList, {
                // Expand the circular radius 
                x: (index) => {
                  return Math.round(
                    radius2 * Math.cos(sliceAngle * index - Math.PI / 4)
                  );
                },
                y: (index) => {
                  return (
                    Math.round(radius2 * Math.sin(sliceAngle * index - Math.PI / 4)) -
                    radius1
                  );
                },
                rotation: (index) => {
                  return (index + 1) * (360 / count);
                },
              })
              .to(
                cardList,
                {
                  rotateY: 180,
                  opacity: 0.8,
                  duration: 1,
                },
                "<"
              )
              .from(
                ".headings",
                {
                  opacity: 0,
                  filter: "blur(60px)",
                  duration: 1,
                },
                "<"
              )
              .to(cardList, {
                repeat: -1,
                duration: 2,
                onRepeat: () => {
                  gsap.to(cardList[Math.floor(Math.random() * count)], {
                    rotateY: "+=180",
                  });
                },
              })
              .to(
                ".group",
                {
                  rotation: 360,
                  duration: 20,
                  repeat: -1,
                  ease: "none",
                },
                "<-=2"
              );

            return () => {};
          }
        );
      };

      // Run code after loading images
      preloadImages(".card__img").then(() => {
        document.body.classList.remove("loading");
        init();
      });
    </script>
  </body>
</html>
