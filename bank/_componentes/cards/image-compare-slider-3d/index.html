<!DOCTYPE html>
<html lang="en" data-theme="light" data-reveal="false">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Compare Slider 3D</title>
  <style>
    @import url('https://unpkg.com/normalize.css') layer(normalize);

    @layer normalize, base, demo, trick, debug;

    @layer debug {
      :root {
        --step: 150px;
      }
      *,
      *::before,
      *::after {
        transform-style: preserve-3d;
      }
      section {
        --d: -2;
      }

      section img:last-of-type {
        --d: 1;
      }

      section input {
        --d: 2;
      }

      section .drag {
        --d: 3;
      }

      section::before {
        --d: 2;
      }

      section::after {
        --d: 1;
      }

      section::after,
      section::before {
        content: '';
        pointer-events: none;
        position: absolute;
        inset: 0;
        outline: 4px dashed color-mix(in oklch, canvas, canvasText 75%);
      }

      [data-reveal='false'] {
        main {
          transition: transform 1s 1s;
        }
        section,
        section img:last-of-type,
        section input,
        section .drag {
          transition: transform 1s;
        }
        section::before,
        section::after,
        section input {
          opacity: 0;
          transition: transform 1s, opacity 0.5s;
        }
      }
      [data-reveal='true'] {
        main {
          rotate: var(--yp, 0) calc(var(--xp, 0) * -1) 0 8deg;
          transform: rotateX(-24deg) rotateY(50deg);
          transition: transform 1s;
        }
        section,
        section img:last-of-type,
        section input,
        section::before,
        section::after,
        section .drag {
          transform: translate3d(0, 0, calc(var(--step) * var(--d, 1)));
          transition: transform 1s 1s;
        }
        section::before,
        section::after,
        section input {
          opacity: 1;
          transition: transform 1s 1s, opacity 0.5s 1s;
        }
      }
    }

    @layer trick {
      @supports (animation-timeline: scroll()) and (animation-range: entry) {
        @property --compare {
          inherits: true;
          syntax: '<integer>';
          initial-value: 0;
        }
        input {
          accent-color: red;
        }
        :root {
          timeline-scope: --control;
        }
        section {
          animation: sync both linear reverse;
          animation-timeline: --control;
          animation-range: contain;
        }
        section input::-webkit-slider-thumb {
          view-timeline: --control inline;
        }

        @keyframes sync {
          to {
            --compare: 100;
          }
        }
      }
      section input {
        overflow: hidden;
      }
      section .drag {
        translate: calc(-50% + (var(--compare, 0) * 1cqi)) -50%;
      }

      section img:last-of-type {
        clip-path: inset(0 0 0 calc(var(--compare, 0) * 1%));
      }
    }

    @layer demo {
      section {
        position: relative;
        margin: 0 auto;
        border: 2px solid color-mix(in oklch, canvas, canvasText);
        container-type: inline-size;
        width: clamp(300px, 80vmin, 1080px);
        aspect-ratio: 4 / 3;
        box-shadow: 0 1rem 2rem -1rem light-dark(hsl(0 0% 0% / 0.6), hsl(0 0% 0% / 1));

        img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          position: absolute;
          inset: 0;
        }
        :not(input) {
          pointer-events: none;
        }
        input {
          position: absolute;
          inset: 0;
        }
      }

      input {
        cursor: grab;
      }

      section:active .drag {
        background: hsl(0 0% 20%);
        opacity: 0;
      }

      input:active {
        cursor: grabbing;
      }

      .drag {
        height: 40px;
        aspect-ratio: 1;
        border-radius: 50%;
        position: absolute;
        z-index: 2;
        top: 50%;
        rotate: 90deg;
        translate: -50% -50%;
        color: #fff;
        background: #000;
        border: 2px solid hsl(0 0% 40%);
      }
    }

    @layer base {
      :root {
        --font-size-min: 16;
        --font-size-max: 20;
        --font-ratio-min: 1.2;
        --font-ratio-max: 1.33;
        --font-width-min: 375;
        --font-width-max: 1500;
      }

      html {
        color-scheme: light dark;
      }

      [data-theme='light'] {
        color-scheme: light only;
      }

      [data-theme='dark'] {
        color-scheme: dark only;
      }

      :where(.fluid) {
        --fluid-min: calc(
          var(--font-size-min) * pow(var(--font-ratio-min), var(--font-level, 0))
        );
        --fluid-max: calc(
          var(--font-size-max) * pow(var(--font-ratio-max), var(--font-level, 0))
        );
        --fluid-preferred: calc(
          (var(--fluid-max) - var(--fluid-min)) /
            (var(--font-width-max) - var(--font-width-min))
        );
        --fluid-type: clamp(
          (var(--fluid-min) / 16) * 1rem,
          ((var(--fluid-min) / 16) * 1rem) -
            (((var(--fluid-preferred) * var(--font-width-min)) / 16) * 1rem) +
            (var(--fluid-preferred) * var(--variable-unit, 100vi)),
          (var(--fluid-max) / 16) * 1rem
        );
        font-size: var(--fluid-type);
      }

      *,
      *:after,
      *:before {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-family: 'SF Pro Text', 'SF Pro Icons', 'AOS Icons', 'Helvetica Neue',
          Helvetica, Arial, sans-serif, system-ui;
        background: white;
        margin: 0;
      }

      body::before {
        --size: 45px;
        --line: color-mix(in oklch, canvasText, transparent 70%);
        content: '';
        height: 100vh;
        width: 100vw;
        position: fixed;
        background: linear-gradient(
              90deg,
              var(--line) 1px,
              transparent 1px var(--size)
            )
            50% 50% / var(--size) var(--size),
          linear-gradient(var(--line) 1px, transparent 1px var(--size)) 50% 50% /
            var(--size) var(--size);
        mask: linear-gradient(-20deg, transparent 50%, white);
        top: 0;
        transform-style: flat;
        pointer-events: none;
        z-index: -1;
      }

      /* Utilities */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <input class="slider" type="range" min="0" max="100" value="50" />
      <div class="drag">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.25 15 12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9"
          />
        </svg>
      </div>
      <img
        src="https://assets.codepen.io/605876/vercel-home--dark.png?format=auto&quality=100"
        alt="Vercel Home"
      />
      <img
        src="https://assets.codepen.io/605876/vercel-home--light.png?format=auto&quality=100"
        alt="Vercel Home"
      />
    </section>
  </main>

  <script type="module">
    if (!CSS.supports('(animation-timeline: view()) and (animation-range: 0 100%)')) {
      class Slider {
        constructor(element) {
          const input = element;
          const sync = () => {
            const val = (input.value - input.min) / (input.max - input.min);
            document.documentElement.style.setProperty(
              '--compare',
              Math.round(val * 100)
            );
          };
          console.info('polyfilling scroll animation for input:', element);
          input.addEventListener('input', sync);
          // on iOS, you'll also want to cater for starting an interaction
          input.addEventListener('pointerdown', sync);
          sync();
        }
      }
      const sliders = document.querySelectorAll('.slider');
      for (const slider of sliders) new Slider(slider);
    }

    const syncParallax = ({ x, y }) => {
      document.documentElement.style.setProperty('--xp', x / window.innerWidth - 0);
      document.documentElement.style.setProperty('--yp', y / window.innerHeight - 0);
    };

    document.body.addEventListener('pointermove', syncParallax);
  </script>
</body>
</html>
