<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button: atlas</title>
  <style>
    *,
    *::after,
    *::before {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* O Botão */
    .button {
      pointer-events: auto;
      cursor: pointer;
      background: #FC016E;
      color: #ffffff;
      border: none;
      padding: 1.5rem 3rem;
      margin: 0;
      font-family: inherit;
      font-size: 1.125rem;
      font-weight: 500;
      position: relative;
      display: inline-block;
      overflow: hidden;
    }

    .button--atlas > span {
      display: inline-block;
      transition: opacity 0.3s ease;
    }

    .button--atlas:hover > span {
      opacity: 0;
    }

    .button--atlas:hover .marquee__inner {
      animation-play-state: running;
      opacity: 1;
      transition-duration: 0.4s;
    }

    /* O Efeito Marquee (Texto Deslizante) */
    .marquee {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .marquee__inner {
      width: fit-content;
      display: flex;
      position: relative;
      --offset: 1rem;
      --move-initial: calc(-25% + var(--offset));
      --move-final: calc(-50% + var(--offset));
      transform: translate3d(var(--move-initial), 0, 0);
      animation: marquee 1s linear infinite;
      animation-play-state: paused;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .marquee span {
      text-align: center;
      white-space: nowrap;
      font-style: italic;
      padding: 1.5rem 1rem;
      display: inline-block;
    }

    @keyframes marquee {
      0% {
        transform: translate3d(var(--move-initial), 0, 0);
      }
      100% {
        transform: translate3d(var(--move-final), 0, 0);
      }
    }
  </style>
</head>
<body>

  <button class="button button--atlas">
    <span>Atlas</span>
    <div class="marquee" aria-hidden="true">
      <div class="marquee__inner">
        <span>Atlas</span>
        <span>Atlas</span>
        <span>Atlas</span>
        <span>Atlas</span>
      </div>
    </div>
  </button>

</body>
</html>
