<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão Pan</title>
    <style>
        *,
        *::after,
        *::before {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            font-family: sans-serif;
        }

        /* Base do botão */
        .button {
            pointer-events: auto;
            cursor: pointer;
            background: #e7e7e7;
            border: none;
            padding: 1.5rem 3rem;
            margin: 0;
            font-family: inherit;
            font-size: 1.1rem;
            position: relative;
            display: inline-block;
            outline: none;
        }

        .button::before,
        .button::after {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Estilo PAN */
        .button--pan {
            font-weight: 700;
            border: 2px solid #FC016E;
            border-radius: 3rem;
            overflow: hidden;
            color: #fff;
        }

        .button--pan span {
            position: relative;
            display: block;
            z-index: 10;
            transition: color 0.3s cubic-bezier(0.7, 0, 0.2, 1);
        }

        .button--pan:hover span {
            color: #FC016E;
        }

        .button--pan::before {
            content: '';
            background: #FC016E;
            transition: transform 0.3s cubic-bezier(0.7, 0, 0.2, 1);
        }

        .button--pan:hover::before {
            transform: translate3d(0, -100%, 0);
        }
    </style>
</head>
<body>

    <button class="button button--pan"><span>Paneo</span></button>

</body>
</html>
