<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button: Pandora Neo</title>

    <style>
        *,
        *::after,
        *::before {
            box-sizing: border-box;
        }

        :root {
            font-size: 18px;
        }

        body {
            margin: 0;
            --color-text: #111;
            --color-bg: #fff;
            color: var(--color-text);
            background-color: var(--color-bg);
            font-family: 'Tenon', sans-serif, system-ui;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            
            /* Centrar o botão no ecrã */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }

        /* Estilos base do botão */
        .button {
            pointer-events: auto;
            cursor: pointer;
            background: #e7e7e7;
            border: none;
            padding: 1.5rem 3rem;
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            position: relative;
            display: inline-block;
        }

        .button::before,
        .button::after {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Estilos específicos do botão Pandora */
        .button--pandora {
            background: #000;
            font-weight: 700;
            padding: 0;
            border-radius: 5px;
        }

        .button--pandora span {
            display: block;
            background: #fc016e;
            padding: 1.5rem 2rem;
            border: 1px solid #000;
            border-radius: 5px;
            /* Estado inicial com deslocamento 3D */
            transform: translate3d(-4px, -4px, 0);
            transition: transform 0.3s cubic-bezier(0.7, 0, 0.2, 1);
        }

        /* Efeito ao pairar (passar o rato) */
        .button--pandora:hover span {
            /* Aumenta o deslocamento ao passar o rato */
            transform: translate3d(-8px, -8px, 0);
        }
        
        /* Efeito de clique (ativo) opcional para dar mais realismo */
        .button--pandora:active span {
            transform: translate3d(0px, 0px, 0);
            transition: transform 0.1s;
        }
    </style>
</head>
<body>

    <button class="button button--pandora">
        <span>Pandora Neo</span>
    </button>

</body>
</html>
