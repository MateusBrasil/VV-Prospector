<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphing Button</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #ececec;
      font-size: clamp(1.5rem, 2vw + 0.5rem, 2.5rem);
      
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 700;
      
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* Variáveis de animação */
      --filter-default: none;
      --filter-morph: blur(12px) contrast(50);
      --transform-default: none;
      --transform-morph: scaleY(0.6);
    }

    .wrapper {
      position: relative;
      padding: 12px 36px;
      
      color: #fff;
      background-color: #FC016E;
      border-radius: 99px;
      box-shadow: 2px 2px 12px #0003;
      
      overflow: hidden;
      cursor: crosshair;
    }

    /* Regras de Hover desaninadas para CSS padrão */
    .wrapper:hover .title.default {
      opacity: 0;
      filter: var(--filter-morph);
      transform: var(--transform-morph);
    }

    .wrapper:hover .title.hovered {
      opacity: 1;
      filter: var(--filter-default);
      transform: var(--transform-default);
    }

    .title {
      text-align: center;
      white-space: nowrap;
      
      background-color: inherit;
      
      transition: all 0.7s;
      will-change: filter;
    }

    .title.default {
      filter: var(--filter-default);
    }

    .title.hovered {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      
      opacity: 0;
      filter: var(--filter-morph);
      transform: var(--transform-morph);
    }
  </style>
</head>
<body>

  <!-- No SVG filter here 🙂 -->
  <div class="wrapper">
    <div class="title default">Book a demo</div>
    <div class="title hovered">Let's talk!</div>
  </div>

</body>
</html>
