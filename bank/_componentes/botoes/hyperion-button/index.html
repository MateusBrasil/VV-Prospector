<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão Hyperion</title>
    <style>
        *,
        *::after,
        *::before {
            box-sizing: border-box;
        }

        /* Centraliza o botão no ecrã de forma limpa */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            font-family: monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Estilo base do botão */
        .button {
            pointer-events: auto;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 1.5rem 3rem;
            margin: 0;
            font-size: 1.1rem;
            position: relative;
            display: inline-block;
            outline: none;
        }

        .button::before,
        .button::after {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Estilo do botão Hyperion com transição de cor direta */
        .button--hyperion {
            font-weight: 500;
            padding: 1rem 1.75rem;
            border: 1px solid #FC016E;
            overflow: hidden;
            color: #ffffff; /* Texto começa branco */
            transition: color 0.3s cubic-bezier(0.7, 0, 0.2, 1);
        }

        /* Quando passamos o rato, o texto muda para rosa */
        .button--hyperion:hover {
            color: #FC016E;
        }

        .button--hyperion span {
            display: block;
            position: relative;
        }

        .button--hyperion > span {
            overflow: hidden;
        }

        .button--hyperion > span > span {
            overflow: hidden;
        }

        /* Animações de rolagem ao passar o rato (hover) */
        .button--hyperion:hover > span > span {
            animation: MoveUpInitial 0.2s forwards, MoveUpEnd 0.2s forwards 0.2s;
        }

        /* Fundo rosa que encolhe para a esquerda */
        .button--hyperion::before {
            content: '';
            background: #FC016E;
            transition: transform 0.3s cubic-bezier(0.7, 0, 0.2, 1);
            transform-origin: 100% 50%;
        }

        .button--hyperion:hover::before {
            transform: scale3d(0, 1, 1);
            transform-origin: 0% 50%;
        }

        /* Transição do texto a sair para o topo */
        @keyframes MoveUpInitial {
            to {
                transform: translate3d(0, -105%, 0);
            }
        }

        /* Transição do texto a regressar por baixo */
        @keyframes MoveUpEnd {
            from {
                transform: translate3d(0, 100%, 0);
            }
            to {
                transform: translate3d(0, 0, 0);
            }
        }
    </style>
</head>
<body>

    <button class="button button--hyperion">
        <span>
            <span>Hyperion</span>
        </span>
    </button>

</body>
</html>
