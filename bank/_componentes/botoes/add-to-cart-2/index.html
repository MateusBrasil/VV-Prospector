<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Cart Button</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
    <style>
        html {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            font-family: 'Inter', 'Inter UI', Arial, sans-serif;
            justify-content: center;
            align-items: center;
            background: #FFFFFF;
        }

        .dribbble {
            position: fixed;
            display: block;
            right: 20px;
            bottom: 20px;
        }

        .dribbble img {
            display: block;
            height: 28px;
        }

        .button {
            --background: #362A89;
            --text: #fff;
            --cart: #fff;
            --tick: var(--background);
            position: relative;
            border: none;
            background: none;
            padding: 8px 28px;
            border-radius: 8px;
            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            overflow: hidden;
            cursor: pointer;
            text-align: center;
            min-width: 144px;
            color: var(--text);
            background: var(--background);
            transform: scale(var(--scale, 1));
            transition: transform .4s cubic-bezier(.36, 1.01, .32, 1.27);
        }

        .button:active {
            --scale: .95;
        }

        .button span {
            font-size: 14px;
            font-weight: 500;
            display: block;
            position: relative;
            padding-left: 24px;
            margin-left: -8px;
            line-height: 26px;
            transform: translateY(var(--span-y, 0));
            transition: transform .7s ease;
        }

        .button span:before,
        .button span:after {
            content: '';
            width: var(--w, 2px);
            height: var(--h, 14px);
            border-radius: 1px;
            position: absolute;
            left: var(--l, 8px);
            top: var(--t, 6px);
            background: currentColor;
            transform: scale(.75) rotate(var(--icon-r, 0deg)) translateY(var(--icon-y, 0));
            transition: transform .65s ease .05s;
        }

        .button span:after {
            --w: 14px;
            --h: 2px;
            --l: 2px;
            --t: 12px;
        }

        .button .cart {
            position: absolute;
            left: 50%;
            top: 50%;
            margin: -13px 0 0 -18px;
            transform-origin: 12px 23px;
            transform: translateX(-120px) rotate(-18deg);
        }

        .button .cart:before,
        .button .cart:after {
            content: '';
            position: absolute;
        }

        .button .cart:before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            box-shadow: inset 0 0 0 2px var(--cart);
            bottom: 0;
            left: 9px;
            filter: drop-shadow(11px 0 0 var(--cart));
        }

        .button .cart:after {
            width: 16px;
            height: 9px;
            background: var(--cart);
            left: 9px;
            bottom: 7px;
            transform-origin: 50% 100%;
            transform: perspective(4px) rotateX(-6deg) scaleY(var(--fill, 0));
            transition: transform 1.2s ease var(--fill-d);
        }

        .button .cart svg {
            z-index: 1;
            width: 36px;
            height: 26px;
            display: block;
            position: relative;
            fill: none;
            stroke: var(--cart);
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .button .cart svg polyline:last-child {
            stroke: var(--tick);
            stroke-dasharray: 10px;
            stroke-dashoffset: var(--offset, 10px);
            transition: stroke-dashoffset .4s ease var(--offset-d);
        }

        .button.loading {
            --scale: .95;
            --span-y: -32px;
            --icon-r: 180deg;
            --fill: 1;
            --fill-d: .8s;
            --offset: 0;
            --offset-d: 1.73s;
        }

        .button.loading .cart {
            animation: cart 3.4s linear forwards .2s;
        }

        @keyframes cart {
            12.5% {
                transform: translateX(-60px) rotate(-18deg);
            }
            25%, 45%, 55%, 75% {
                transform: none;
            }
            50% {
                transform: scale(.9);
            }
            44%, 56% {
                transform-origin: 12px 23px;
            }
            45%, 55% {
                transform-origin: 50% 50%;
            }
            87.5% {
                transform: translateX(70px) rotate(-18deg);
            }
            100% {
                transform: translateX(140px) rotate(-18deg);
            }
        }
    </style>
</head>
<body>

    <button class="button">
        <span>Add to cart</span>
        <div class="cart">
            <svg viewBox="0 0 36 26">
                <polyline points="1 2.5 6 2.5 10 18.5 25.5 18.5 28.5 7.5 7.5 7.5"></polyline>
                <polyline points="15 13.5 17 15.5 22 10.5"></polyline>
            </svg>
        </div>
    </button>

    <!-- dribbble -->
    <a class="dribbble" href="https://dribbble.com/shots/9713067-Add-to-cart" target="_blank">
        <img src="https://cdn.dribbble.com/assets/dribbble-ball-mark-2bd45f09c2fb58dbbfb44766d5d1d07c5a12972d602ef8b32204d28fa3dda554.svg" alt="">
    </a>

    <script>
        document.querySelectorAll('.button').forEach(button => button.addEventListener('click', e => {
            if(!button.classList.contains('loading')) {
                button.classList.add('loading');
                setTimeout(() => button.classList.remove('loading'), 3700);
            }
            e.preventDefault();
        }));
    </script>
</body>
</html>
