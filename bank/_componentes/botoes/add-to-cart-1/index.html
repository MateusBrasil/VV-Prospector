<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Add to Cart Button</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: inherit;
        }

        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Inter', Arial, sans-serif;
            background: #ffffff;
        }

        /* --- Converted SCSS to CSS --- */
        .add-to-cart {
            --background-default: #17171B;
            --background-hover: #2b2b36;
            --background-scale: 1;
            --text-color: #ffffff;
            --text-o: 1;
            --text-x: 16px;
            --cart: #ffffff;
            --cart-x: -56px;
            --cart-y: 0px;
            --cart-rotate: 0deg;
            --cart-scale: .75;
            --cart-clip: 0px;
            --cart-clip-x: 0px;
            --cart-tick-offset: 10px;
            --cart-tick-color: #007AFF;
            --shirt-y: -16px;
            --shirt-scale: 0;
            --shirt-color: #17171B;
            --shirt-logo: #ffffff;
            --shirt-second-y: 24px;
            --shirt-second-color: #ffffff;
            --shirt-second-logo: #17171B;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            outline: none;
            background: none;
            border: none;
            padding: 12px 0;
            width: 180px;
            margin: 0;
            cursor: pointer;
            position: relative;
            font-family: inherit;
        }

        .add-to-cart:before {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            border-radius: 5px;
            transition: background .25s;
            background: var(--background, var(--background-default));
            transform: scaleX(var(--background-scale)) translateZ(0);
        }

        .add-to-cart:not(.active):hover {
            --background: var(--background-hover);
        }

        .add-to-cart span {
            display: block;
            text-align: center;
            position: relative;
            z-index: 1;
            font-size: 14px;
            font-weight: 600;
            line-height: 24px;
            color: var(--text-color);
            opacity: var(--text-o);
            transform: translateX(var(--text-x)) translateZ(0);
        }

        .add-to-cart svg {
            display: block;
            width: var(--svg-width, 24px);
            height: var(--svg-height, 24px);
            position: var(--svg-position, relative);
            left: var(--svg-left, 0);
            top: var(--svg-top, 0);
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .add-to-cart svg path {
            fill: var(--svg-fill, none);
            stroke: var(--svg-stroke, none);
            stroke-width: var(--svg-stroke-width, 2);
        }

        .add-to-cart .morph {
            --svg-width: 64px;
            --svg-height: 13px;
            --svg-left: 50%;
            --svg-top: -12px;
            --svg-position: absolute;
            --svg-fill: var(--background, var(--background-default));
            transition: fill .25s;
            pointer-events: none;
            margin-left: -32px;
        }

        .add-to-cart .shirt,
        .add-to-cart .cart {
            pointer-events: none;
            position: absolute;
            left: 50%;
        }

        .add-to-cart .shirt {
            margin: -12px 0 0 -12px;
            top: 0;
            transform-origin: 50% 100%;
            transform: translateY(var(--shirt-y)) scale(var(--shirt-scale));
        }

        .add-to-cart .shirt svg {
            --svg-fill: var(--shirt-color);
        }

        .add-to-cart .shirt svg g {
            --svg-fill: var(--svg-g-fill, var(--shirt-logo));
        }

        .add-to-cart .shirt svg.second {
            --svg-fill: var(--shirt-second-color);
            --svg-g-fill: var(--shirt-second-logo);
            --svg-position: absolute;
            clip-path: polygon(0 var(--shirt-second-y), 24px var(--shirt-second-y), 24px 24px, 0 24px);
        }

        .add-to-cart .cart {
            --svg-width: 36px;
            --svg-height: 26px;
            --svg-stroke: var(--cart);
            top: 10px;
            margin-left: -18px;
            transform: translate(var(--cart-x), var(--cart-y)) rotate(var(--cart-rotate)) scale(var(--cart-scale)) translateZ(0);
        }

        .add-to-cart .cart:before {
            content: '';
            display: block;
            width: 22px;
            height: 12px;
            position: absolute;
            left: 7px;
            top: 7px;
            background: var(--cart);
            clip-path: polygon(0 0, 22px 0, calc(22px - var(--cart-clip-x)) var(--cart-clip), var(--cart-clip-x) var(--cart-clip));
        }

        .add-to-cart .cart path.wheel {
            --svg-stroke-width: 1.5;
        }

        .add-to-cart .cart path.tick {
            --svg-stroke: var(--cart-tick-color);
            stroke-dasharray: 10px;
            stroke-dashoffset: var(--cart-tick-offset);
        }
    </style>
</head>
<body>

    <button class="add-to-cart">
        <span>Garantir acesso</span>
        <svg class="morph" viewBox="0 0 64 13">
            <path d="M0 12C6 12 17 12 32 12C47.9024 12 58 12 64 12V13H0V12Z" />
        </svg>
        <div class="shirt">
            <svg class="first" viewBox="0 0 24 24">
                <path d="M11 2C11 7.52285 15.4772 12 21 12C15.4772 12 11 16.4772 11 22C11 16.4772 6.52285 12 1 12C6.52285 12 11 7.52285 11 2Z"/>
                <g>
                    <path d="M19 3C19 4.65685 20.3431 6 22 6C20.3431 6 19 7.34315 19 9C19 7.34315 17.6569 6 16 6C17.6569 6 19 4.65685 19 3Z"/>
                </g>
            </svg>
            <svg class="second" viewBox="0 0 24 24">
                <path d="M11 2C11 7.52285 15.4772 12 21 12C15.4772 12 11 16.4772 11 22C11 16.4772 6.52285 12 1 12C6.52285 12 11 7.52285 11 2Z"/>
                <g>
                    <path d="M19 3C19 4.65685 20.3431 6 22 6C20.3431 6 19 7.34315 19 9C19 7.34315 17.6569 6 16 6C17.6569 6 19 4.65685 19 3Z"/>
                </g>
            </svg>
        </div>
        <div class="cart">
            <svg viewBox="0 0 36 26">
                <path d="M1 2.5H6L10 18.5H25.5L28.5 7.5L7.5 7.5" class="shape" />
                <path d="M11.5 25C12.6046 25 13.5 24.1046 13.5 23C13.5 21.8954 12.6046 21 11.5 21C10.3954 21 9.5 21.8954 9.5 23C9.5 24.1046 10.3954 25 11.5 25Z" class="wheel" />
                <path d="M24 25C25.1046 25 26 24.1046 26 23C26 21.8954 25.1046 21 24 21C22.8954 21 22 21.8954 22 23C22 24.1046 22.8954 25 24 25Z" class="wheel" />
                <path d="M14.5 13.5L16.5 15.5L21.5 10.5" class="tick" />
            </svg>
        </div>
    </button>

    <!-- GSAP Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/MorphSVGPlugin3.min.js"></script>
    
    <script>
        // Ensure scripts are loaded before running
        window.addEventListener('DOMContentLoaded', () => {
            gsap.registerPlugin(MorphSVGPlugin);

            document.querySelectorAll('.add-to-cart').forEach(button => {
                let morph = button.querySelector('.morph path');
                
                button.addEventListener('pointerdown', e => {
                    if (button.classList.contains('active')) {
                        return;
                    }
                    gsap.to(button, {
                        '--background-scale': .97,
                        duration: .15
                    });
                });

                button.addEventListener('click', e => {
                    e.preventDefault();
                    if (button.classList.contains('active')) {
                        return;
                    }
                    button.classList.add('active');
                    
                    gsap.to(button, {
                        keyframes: [{
                            '--background-scale': .97,
                            duration: .15
                        }, {
                            '--background-scale': 1,
                            delay: .125,
                            duration: 1.2,
                            ease: 'elastic.out(1, .6)'
                        }]
                    });

                    gsap.to(button, {
                        keyframes: [{
                            '--shirt-scale': 1,
                            '--shirt-y': '-42px',
                            '--cart-x': '0px',
                            '--cart-scale': 1,
                            duration: .4,
                            ease: 'power1.in'
                        }, {
                            '--shirt-y': '-40px',
                            duration: .3
                        }, {
                            '--shirt-y': '16px',
                            '--shirt-scale': .9,
                            duration: .25,
                            ease: 'none'
                        }, {
                            '--shirt-scale': 0,
                            duration: .3,
                            ease: 'none'
                        }]
                    });

                    gsap.to(button, {
                        '--shirt-second-y': '0px',
                        delay: .835,
                        duration: .12
                    });

                    gsap.to(button, {
                        keyframes: [{
                            '--cart-clip': '12px',
                            '--cart-clip-x': '3px',
                            delay: .9,
                            duration: .06
                        }, {
                            '--cart-y': '2px',
                            duration: .1
                        }, {
                            '--cart-tick-offset': '0px',
                            '--cart-y': '0px',
                            duration: .2,
                            onComplete() {
                                button.style.overflow = 'hidden';
                            }
                        }, {
                            '--cart-x': '52px',
                            '--cart-rotate': '-15deg',
                            duration: .2
                        }, {
                            '--cart-x': '104px',
                            '--cart-rotate': '0deg',
                            duration: .2,
                            clearProps: true,
                            onComplete() {
                                button.style.overflow = 'hidden';
                                button.style.setProperty('--text-o', 0);
                                button.style.setProperty('--text-x', '0px');
                                button.style.setProperty('--cart-x', '-104px');
                            }
                        }, {
                            '--text-o': 1,
                            '--text-x': '16px',
                            '--cart-x': '-56px',
                            '--cart-scale': .75,
                            duration: .25,
                            clearProps: true,
                            onComplete() {
                                button.classList.remove('active');
                            }
                        }]
                    });

                    gsap.to(button, {
                        keyframes: [{
                            '--text-o': 0,
                            duration: .3
                        }]
                    });

                    gsap.to(morph, {
                        keyframes: [{
                            morphSVG: 'M0 12C6 12 20 10 32 0C43.9024 9.99999 58 12 64 12V13H0V12Z',
                            duration: .25,
                            ease: 'power1.out'
                        }, {
                            morphSVG: 'M0 12C6 12 17 12 32 12C47.9024 12 58 12 64 12V13H0V12Z',
                            duration: .15,
                            ease: 'none'
                        }]
                    });
                });
            });
        });
    </script>
</body>
</html>
