<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão Mimas</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* --- Estilo do Botão Mimas --- */
        .button-mimas {
            cursor: pointer;
            background: #FC016E;
            border: none;
            padding: 1.5rem 3rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05rem;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            border-radius: 0.5rem;
            overflow: hidden;
            color: #ffffff;
        }

        .button-mimas span {
            position: relative;
            z-index: 2;
        }

        .button-mimas::before {
            content: '';
            position: absolute;
            top: 0;
            left: -10%;
            width: 120%;
            height: 100%;
            background: #000000;
            transform: skew(30deg);
            transition: transform 0.4s cubic-bezier(0.3, 1, 0.8, 1);
            z-index: 1;
        }

        .button-mimas:hover::before {
            transform: translate3d(100%, 0, 0);
        }
    </style>
</head>
<body>

    <button class="button-mimas">
        <span>Mimas</span>
    </button>

</body>
</html>
