<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Button: dione</title>
  
    <style>
        *,
        *::after,
        *::before {
            box-sizing: border-box;
        }
        
        :root {
            font-size: 18px;
        }
        
        body {
            margin: 0;
            --color-text: #111;
            --color-number: #999;
            --color-bg: #fff;
            --color-link: #1352d1;
            --color-link-hover: #111;
            color: var(--color-text);
            background-color: var(--color-bg);
            font-family: tenon, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            
            /* Center the button */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }
        
        .button {
            pointer-events: auto;
            cursor: pointer;
            background: #e7e7e7;
            border: none;
            padding: 1.5rem 3rem;
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            position: relative;
            display: inline-block;
        }
        
        .button::before,
        .button::after {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .button--dione {
            background: none;
            font-family: obvia, sans-serif;
            font-weight: 500;
            font-style: italic;
            padding: 1.5rem 3rem;
        }

        .button--dione span {
            display: inline-block;
            position: relative;
            color: #fff;
            z-index: 10; /* Ensures text stays above the background */
        }

        .button--dione::before {
            content: '';
            background: #000;
            transition: transform 0.3s cubic-bezier(0.2,1,0.7,1);
        }

        .button--dione:hover::before {
            transform: scale3d(0.9, 0.8, 1);
        }

        .button--dione::after {
            content: '';
            border: 1px solid #000;
            transition: transform 0.3s cubic-bezier(0.2,1,0.7,1);
            border-radius: 0px;
            transform: scale3d(0.85, 0.65, 1);
        }

        .button--dione:hover::after {
            transform: scale3d(1,1,1);
        }
    </style>
</head>
<body>
    <button class="button button--dione"><span>Dione</span></button>
</body>
</html>
