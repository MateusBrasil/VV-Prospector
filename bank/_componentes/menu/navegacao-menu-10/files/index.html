<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Orbit — Studio</title>

   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

   <link rel="stylesheet" href="style.css" />
</head>

<body>

   <!-- ===== HEADER ===== -->
   <header class="header">
      <a href="#" class="brand">Orbit<span>*</span></a>

      <!-- Circular toggle. Hover morphs it into a squished gooey shape
           via CSS border-radius transition. On click, the SVG circle
           clip-path below animates from a dot at this button's centre
           outwards to cover the whole viewport. -->
      <button class="toggle" id="js-toggle" type="button" aria-label="Open menu">
         <span class="toggle__inner" aria-hidden="true">
            <span class="toggle__line"></span>
            <span class="toggle__line"></span>
            <span class="toggle__line"></span>
         </span>
      </button>
   </header>

   <!-- ===== HERO ===== -->
   <main class="hero">
      <img src="./img/hero.jpg" alt="" class="hero__bg" />
      <h1 class="hero__title">
         Ideas<br/>in <em>motion.</em>
      </h1>
   </main>

   <!-- ===== MENU OVERLAY =====
        Uses an SVG with <clipPath> and a <circle>. On open, the circle's
        r attribute tweens from ~0 to a value big enough to cover the
        viewport diagonal — giving the "ink blot spreading from cursor"
        reveal effect. Content inside is clipped by that circle. -->
   <div class="menu" id="js-menu" aria-hidden="true">

      <!-- SVG defining the expanding circle mask -->
      <svg class="menu__svg" aria-hidden="true">
         <defs>
            <clipPath id="orbitClip" clipPathUnits="userSpaceOnUse">
               <circle id="js-clip-circle" cx="50" cy="50" r="0" />
            </clipPath>
         </defs>
         <!-- The dark background rectangle is clipped by our circle.
              As the circle grows, more of this fill shows through. -->
         <rect class="menu__fill" width="100%" height="100%"
               clip-path="url(#orbitClip)" />
      </svg>

      <!-- Menu content sits inside a div that is also clipped by the
           same growing circle — ensures text appears only where the
           dark fill has arrived. -->
      <div class="menu__content" id="js-content">

         <nav class="nav">
            <ul class="nav__list">
               <li class="nav__item">
                  <a href="#" class="nav__link">
                     <span class="nav__num">01</span>
                     <span class="nav__text">
                        <span class="nav__text__main">Work</span>
                        <span class="nav__text__alt">Work</span>
                     </span>
                  </a>
               </li>
               <li class="nav__item">
                  <a href="#" class="nav__link">
                     <span class="nav__num">02</span>
                     <span class="nav__text">
                        <span class="nav__text__main">Studio</span>
                        <span class="nav__text__alt">Studio</span>
                     </span>
                  </a>
               </li>
               <li class="nav__item">
                  <a href="#" class="nav__link">
                     <span class="nav__num">03</span>
                     <span class="nav__text">
                        <span class="nav__text__main">Journal</span>
                        <span class="nav__text__alt">Journal</span>
                     </span>
                  </a>
               </li>
               <li class="nav__item">
                  <a href="#" class="nav__link">
                     <span class="nav__num">04</span>
                     <span class="nav__text">
                        <span class="nav__text__main">Contact</span>
                        <span class="nav__text__alt">Contact</span>
                     </span>
                  </a>
               </li>
            </ul>
         </nav>
      </div>
   </div>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
   <script src="script.js"></script>
</body>

</html>
