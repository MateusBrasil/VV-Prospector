<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Sliding Stairs Menu</title>

   <!-- Connected Styles -->
   <link rel="stylesheet" href="style.css" />
</head>

<body>
   <!-- ===== HTML ===== -->

   <!-- Demo page content behind the menu -->
   <main class="page">
      <h1 class="page__title">Sliding Stairs</h1>
   </main>

   <!-- ===== BURGER BLOCK =====
        Small black "Menu" button fixed in the top-right corner.
        Clicking it opens the full-screen menu. -->
   <div class="burger" id="js-burger">
      <!-- Yellow background slab that grows on hover (pure CSS) -->
      <div class="burger__bg"></div>

      <!-- Two-line icon -->
      <svg class="burger__icon" width="56" height="7" viewBox="0 0 56 7" fill="none" xmlns="http://www.w3.org/2000/svg">
         <line x1="56" y1="0.5" x2="4.37114e-08" y2="0.500005" stroke="white" />
         <line x1="56" y1="6.5" x2="28" y2="6.5" stroke="white" />
      </svg>

      <p class="burger__label">Menu</p>
   </div>

   <!-- ===== STAIRS BLOCK =====
        5 vertical black bars used for the "stairs" reveal effect.
        They grow from 0 → 100% height with a stagger, creating a
        stepped animation across the screen before the menu appears.
        Kept hidden until the menu is triggered (height: 0 via CSS). -->
   <div class="stairs" id="js-stairs">
      <div class="stairs__bar"></div>
      <div class="stairs__bar"></div>
      <div class="stairs__bar"></div>
      <div class="stairs__bar"></div>
      <div class="stairs__bar"></div>

      <!-- Solid black backdrop that fades in under the menu content -->
      <div class="stairs__bg" id="js-stairs-bg"></div>
   </div>

   <!-- ===== MENU BLOCK =====
        Full-screen overlay with three big links, close button
        and social footer. Hidden by default (opacity: 0) and
        revealed after the stairs animation finishes. -->
   <div class="menu" id="js-menu">

      <!-- Close button (X icon) -->
      <div class="menu__header">
         <svg class="menu__close" id="js-close" width="68" height="68" viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.5 1.5L67 67" stroke="white" />
            <path d="M66.5 1L0.999997 66.5" stroke="white" />
         </svg>
      </div>

      <!-- ELEMENT: menu__body — the three big links.
           Each has an "outer" overlay that slides in on hover with
           infinite-scrolling images + description (the signature
           sliding-stairs effect). -->
      <div class="menu__body">

         <!-- Link #1: Projects -->
         <div class="menu__item" data-images="projects1.jpg,projects2.jpg" data-desc="To See Everything">
            <a href="#" class="menu__link">Projects</a>
            <!-- Hover overlay (starts hidden above/below, slides into place) -->
            <div class="menu__outer">
               <div class="menu__inner">
                  <!-- Two copies in a row → seamless infinite marquee -->
                  <div class="menu__container">
                     <div class="menu__img-container"><img src="img/projects1.jpg" alt="" /></div>
                     <p>To See Everything</p>
                     <div class="menu__img-container"><img src="img/projects2.jpg" alt="" /></div>
                     <p>To See Everything</p>
                  </div>
                  <div class="menu__container">
                     <div class="menu__img-container"><img src="img/projects1.jpg" alt="" /></div>
                     <p>To See Everything</p>
                     <div class="menu__img-container"><img src="img/projects2.jpg" alt="" /></div>
                     <p>To See Everything</p>
                  </div>
               </div>
            </div>
         </div>

         <!-- Link #2: Agence -->
         <div class="menu__item" data-images="agence1.jpg,agence2.jpg" data-desc="To Learn Everything">
            <a href="#" class="menu__link">Agence</a>
            <div class="menu__outer">
               <div class="menu__inner">
                  <div class="menu__container">
                     <div class="menu__img-container"><img src="img/agence1.jpg" alt="" /></div>
                     <p>To Learn Everything</p>
                     <div class="menu__img-container"><img src="img/agence2.jpg" alt="" /></div>
                     <p>To Learn Everything</p>
                  </div>
                  <div class="menu__container">
                     <div class="menu__img-container"><img src="img/agence1.jpg" alt="" /></div>
                     <p>To Learn Everything</p>
                     <div class="menu__img-container"><img src="img/agence2.jpg" alt="" /></div>
                     <p>To Learn Everything</p>
                  </div>
               </div>
            </div>
         </div>

         <!-- Link #3: Contact -->
         <div class="menu__item" data-images="contact1.jpg,contact2.jpg" data-desc="To Send a FAX">
            <a href="#" class="menu__link">Contact</a>
            <div class="menu__outer">
               <div class="menu__inner">
                  <div class="menu__container">
                     <div class="menu__img-container"><img src="img/contact1.jpg" alt="" /></div>
                     <p>To Send a FAX</p>
                     <div class="menu__img-container"><img src="img/contact2.jpg" alt="" /></div>
                     <p>To Send a FAX</p>
                  </div>
                  <div class="menu__container">
                     <div class="menu__img-container"><img src="img/contact1.jpg" alt="" /></div>
                     <p>To Send a FAX</p>
                     <div class="menu__img-container"><img src="img/contact2.jpg" alt="" /></div>
                     <p>To Send a FAX</p>
                  </div>
               </div>
            </div>
         </div>

      </div>

      <!-- Social footer -->
      <div class="menu__footer">
         <a>FB</a>
         <a>IG</a>
         <a>IN</a>
         <a>BE</a>
      </div>

   </div>

   <!-- ======================= -->

   <!-- Connected libs -->
   <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>

   <!-- Connected script -->
   <script src="script.js"></script>
</body>

</html>
