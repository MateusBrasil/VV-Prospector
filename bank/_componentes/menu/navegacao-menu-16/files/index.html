<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noir Mode Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>

  <header class="site-header">
    <a class="brand" href="#" aria-label="Noir Mode home">
      <span class="brand-mark"></span>
      <span class="brand-name">NOIR MODE</span>
    </a>

    <button class="menu-toggle" type="button" aria-label="Toggle menu">
      <span class="menu-toggle-text" data-open="MENU" data-close="CLOSE">MENU</span>
      <span class="menu-toggle-icon">
        <span></span>
        <span></span>
      </span>
    </button>
  </header>

  <main class="hero-shell">
    <section class="hero-copy">
      <p class="hero-kicker">Larey Byu / dark mode</p>
      <h1>
        BIG<br>
        DARK<br>
        MOTION
      </h1>
    </section>

    <section class="hero-card hero-card-main">
      <div class="hero-card-inner">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <p>Editorial direction with oversized type and clean motion.</p>
      </div>
    </section>

    <section class="hero-card hero-card-side">
      <div class="hero-card-inner hero-card-lines">
        <span></span><span></span><span></span>
      </div>
    </section>
  </main>

  <aside class="menu" aria-hidden="true">
    <div class="menu-backdrop"></div>

    <div class="menu-strips">
      <span class="menu-strip"></span>
      <span class="menu-strip"></span>
      <span class="menu-strip"></span>
      <span class="menu-strip"></span>
    </div>

    <div class="menu-frame"></div>

    <div class="menu-inner">
      <div class="menu-meta">
        <p>Selected navigation</p>
      </div>

      <nav class="menu-nav">
        <a href="#" class="menu-link"><span>INDEX</span></a>
        <a href="#" class="menu-link"><span>WORK</span></a>
        <a href="#" class="menu-link"><span>ABOUT</span></a>
        <a href="#" class="menu-link"><span>CONTACT</span></a>
      </nav>
    </div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
