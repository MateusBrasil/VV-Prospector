<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Prism — Colourful Practice</title>

   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

   <link rel="stylesheet" href="style.css" />
</head>

<body>

   <!-- ===== TOPBAR ===== -->
   <header class="topbar">
      <a href="#" class="logo">
         <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
            <!-- Prism-triangle icon -->
            <polygon points="20,4 38,34 2,34" fill="currentColor" />
         </svg>
         <span>Prism</span>
      </a>

      <span class="topbar__meta"></span>

      <button class="btn" id="js-toggle" type="button" aria-label="Open menu">
         <span class="btn__label">Menu</span>
      </button>
   </header>

   <!-- ===== HERO ===== -->
   <main class="hero">
      <h1 class="hero__word">Prism</h1>
   </main>

   <!-- ===== MENU OVERLAY =====
        Structure:
        • .panels — 6 vertical coloured panels that fall from
          the top with a stagger. Together they form a striped
          full-screen background.
        • .menu__content — nav and meta sit on top of the panels.
          Each link's letters are individually wrapped in spans
          (generated by JS) so we can stagger them + re-colour
          on hover.  -->
   <div class="menu" id="js-menu" aria-hidden="true">

      <div class="panels" id="js-panels">
         <span class="panels__col" style="--bg: #f2c14e"></span>
         <span class="panels__col" style="--bg: #ff6b5b"></span>
         <span class="panels__col" style="--bg: #6cb5c9"></span>
         <span class="panels__col" style="--bg: #d1ccbe"></span>
         <span class="panels__col" style="--bg: #ff8f4c"></span>
         <span class="panels__col" style="--bg: #1b1b1b"></span>
      </div>

      <div class="menu__content">
         <nav class="nav">
            <ul class="nav__list">
               <li class="nav__item">
                  <a href="#" class="nav__link" data-split>Work</a>
               </li>
               <li class="nav__item">
                  <a href="#" class="nav__link" data-split>Studio</a>
               </li>
               <li class="nav__item">
                  <a href="#" class="nav__link" data-split>Process</a>
               </li>
               <li class="nav__item">
                  <a href="#" class="nav__link" data-split>Contact</a>
               </li>
            </ul>
         </nav>
      </div>
   </div>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
   <script src="script.js"></script>
</body>

</html>
