<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xavier Dynamic Side Navigation Menu</title>
  <style>
    /* Global Style Variables */
    :root {
      --color-primary: #ccff00; /* Accent Color (Neon Green) */
      --color-neutral-100: #ffffff;
      --color-neutral-200: #e0e0e0;
      --color-neutral-300: #f4f4f4;
      --color-neutral-800: #1a1a1a;
      --color-dark: #131313;
      --size-container: 80rem;
      --container-padding: 2rem;
      --gap: 2rem;
      --section-padding: 5rem;
      --cubic-default: cubic-bezier(.65, .05, 0, 1);
    }

    body {
      margin: 0;
      background-color: var(--color-neutral-300);
      color: var(--color-dark);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      line-height: 1;
      overflow-x: hidden;
    }

    /* General Interface Structure */
    .menu-ui {
      z-index: 0;
      pointer-events: none;
      flex-flow: column;
      justify-content: space-between;
      align-items: stretch;
    }

    .nav-row {
      justify-content: space-between;
      align-items: center;
      width: 100%;
      display: flex;
    }

    .nav-logo-row {
      pointer-events: auto;
      justify-content: flex-start;
      align-items: center;
      display: flex;
      text-decoration: none;
      color: var(--color-dark);
    }

    /* Minimalist Text Logo */
    .logo-text {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .container {
      z-index: 1;
      max-width: var(--size-container);
      padding-left: var(--container-padding);
      padding-right: var(--container-padding);
      width: 100%;
      box-sizing: border-box;
      margin-left: auto;
      margin-right: auto;
      position: relative;
    }

    .container.is--full {
      max-width: 100%;
    }

    .nav-row__right {
      grid-column-gap: .625rem;
      grid-row-gap: .625rem;
      pointer-events: auto;
      justify-content: flex-end;
      align-items: center;
      display: flex;
    }

    .header {
      z-index: 110;
      padding-top: var(--gap);
      position: fixed;
      inset: 0% 0% auto;
      width: 100%;
      box-sizing: border-box;
    }

    p { margin: 0px; }

    /* Central Section Area */
    .cloneable {
      padding: var(--section-padding) var(--container-padding);
      justify-content: center;
      align-items: center;
      min-height: 100svh;
      display: flex;
      position: relative;
      --menu-padding: 2em;
    }

    .nav {
      z-index: 100;
      width: 100%;
      height: 100vh;
      margin-left: auto;
      margin-right: auto;
      display: block;
      position: fixed;
      inset: 0%;
    }

    .overlay {
      z-index: 0;
      cursor: pointer;
      background-color: #13131366;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0%;
    }

    /* Menu Panel */
    .menu {
      padding-bottom: var(--menu-padding);
      grid-column-gap: 5em;
      grid-row-gap: 5em;
      padding-top: calc(3 * var(--menu-padding));
      flex-flow: column;
      justify-content: space-between;
      align-items: flex-start;
      width: 35em;
      height: 100%;
      box-sizing: border-box;
      margin-left: auto;
      position: relative;
      overflow: auto;
    }

    .menu-bg {
      z-index: 0;
      position: absolute;
      inset: 0%;
    }

    .menu-inner {
      z-index: 1;
      grid-column-gap: 5em;
      grid-row-gap: 5em;
      flex-flow: column;
      justify-content: space-between;
      align-items: flex-start;
      height: 100%;
      display: flex;
      position: relative;
      overflow: auto;
    }

    /* Sliding Background Panels */
    .bg-panel {
      z-index: 0;
      background-color: var(--color-neutral-300);
      border-top-left-radius: 1.25em;
      border-bottom-left-radius: 1.25em;
      position: absolute;
      inset: 0%;
    }

    .bg-panel.first {
      background-color: var(--color-primary);
    }

    .bg-panel.second {
      background-color: var(--color-neutral-100);
    }

    .menu-list {
      flex-flow: column;
      width: 100%;
      margin-bottom: 0;
      padding-left: 0;
      list-style: none;
      display: flex;
    }

    .menu-list-item {
      position: relative;
      overflow: hidden;
    }

    .menu-link-heading { 
      text-shadow: 0px 1em 0px var(--color-neutral-200); 
    }

    .menu-link {
      padding-top: .75em;
      padding-bottom: .75em;
      padding-left: var(--menu-padding);
      grid-column-gap: .75em;
      grid-row-gap: .75em;
      width: 100%;
      box-sizing: border-box;
      text-decoration: none;
      display: flex;
      color: var(--color-dark);
    }

    /* Bold Navigation Typography */
    .menu-link-heading {
      z-index: 1;
      text-transform: uppercase;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 5em;
      font-weight: 900;
      line-height: .75;
      transition: transform .55s cubic-bezier(.65, .05, 0, 1);
      position: relative;
    }

    .eyebrow {
      z-index: 1;
      color: var(--color-primary);
      text-transform: uppercase;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      position: relative;
    }

    .menu-link-bg {
      z-index: 0;
      background-color: var(--color-neutral-800);
      transform-origin: 50% 100%;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.65, .05, 0, 1);
      position: absolute;
      inset: 0%;
      transform: scale3d(1, 0, 1);
    }

    .menu-details {
      padding-left: var(--menu-padding);
      grid-column-gap: 1.25em;
      grid-row-gap: 1.25em;
      flex-flow: column;
      justify-content: flex-start;
      align-items: flex-start;
      display: flex;
    }

    .p-small {
      font-size: .875em;
      font-family: system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.7;
    }

    .socials-row {
      grid-column-gap: 1.5em;
      grid-row-gap: 1.5em;
      flex-flow: row;
      display: flex;
    }

    .p-large {
      font-size: 1.125em;
      font-family: system-ui, sans-serif;
    }

    .text-link {
      text-decoration: none;
      position: relative;
      color: var(--color-dark);
    }

    /* Menu Toggle Button */
    .menu-button {
      grid-column-gap: .625em;
      grid-row-gap: .625em;
      background-color: transparent;
      justify-content: flex-end;
      align-items: center;
      margin: -1em;
      padding: 1em;
      display: flex;
      border: none;
      color: var(--color-dark);
      font-weight: bold;
    }

    .menu-button-icon {
      width: 1em;
      height: 1em;
    }

    .menu-button-text {
      flex-flow: column;
      justify-content: flex-start;
      align-items: flex-end;
      height: 1.125em;
      display: flex;
      overflow: hidden;
    }

    .icon-wrap {
      transition: transform .4s cubic-bezier(.65, .05, 0, 1);
    }

    /* Hover Interaction Effects */
    @media (hover:hover){
      .menu-button:hover .icon-wrap{transform: rotate(90deg); }
      .menu-link:hover .menu-link-heading{ 
        transform: translate(0px, -1em); 
        transition-delay: 0.1s; 
        color: white; 
        text-shadow: none;
      }
      .menu-link:hover .menu-link-bg{ transform: scale(1,1); }
      .text-link::after{
        content: '';
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 100%;
        height: 1px;
        background: var(--color-primary);
        transform-origin: right center;
        transform: scale(0,1);
        transition: transform 0.4s var(--cubic-default)
      }
      .text-link:hover::after{
        transform-origin: left center;
        transform: scale(1,1);	
      }
    }

    /* Neutral Background Geometric Element */
    .background-graphic {
      width: 10em;
      height: 10em;
      color: rgba(19, 19, 19, 0.15);
    }

    /* Media Queries (Responsive Design) */
    @media screen and (max-width: 767px) {
      .cloneable{ --menu-padding: 1em; }
      .nav-logo-row { width: auto; }
      .nav-row__right { grid-column-gap: 0rem; grid-row-gap: 0rem; }
      .menu { padding-top: calc(6 * var(--menu-padding)); width: 100%; }
      .bg-panel { border-top-left-radius: 0; border-bottom-left-radius: 0; }
      .menu-list-item { height: 4.5em; }
      .menu-link-heading { font-size: 3.5em; }
      .socials-row { grid-column-gap: 1em; grid-row-gap: 1em; }
      .p-large.text-link { font-size: 1em; }
    }

    @media screen and (max-width: 479px) {
      .menu {
        padding-top: calc(7 * var(--menu-padding));
        padding-bottom: calc(2 * var(--menu-padding));
      }
    }
  </style>
</head>
<body>

  <div class="menu-ui">
    <header class="header">
      <div class="container is--full">
        <nav class="nav-row">
          <!-- Main link with updated branding -->
          <a href="javascript:void(0)" aria-label="Home" class="nav-logo-row">
            <span class="logo-text">XAVIER</span>
          </a>
          <div class="nav-row__right">
            <button role="button" data-menu-toggle="" class="menu-button">
              <div class="menu-button-text">
                <p class="p-large">Menu</p>
                <p class="p-large">Close</p>
              </div>
              <div class="icon-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 16 16" fill="none" class="menu-button-icon">
                  <path d="M7.33333 16L7.33333 -3.2055e-07L8.66667 -3.78832e-07L8.66667 16L7.33333 16Z" fill="currentColor"></path>
                  <path d="M16 8.66667L-2.62269e-07 8.66667L-3.78832e-07 7.33333L16 7.33333L16 8.66667Z" fill="currentColor"></path>
                  <path d="M6 7.33333L7.33333 7.33333L7.33333 6C7.33333 6.73637 6.73638 7.33333 6 7.33333Z" fill="currentColor"></path>
                  <path d="M10 7.33333L8.66667 7.33333L8.66667 6C8.66667 6.73638 9.26362 7.33333 10 7.33333Z" fill="currentColor"></path>
                  <path d="M6 8.66667L7.33333 8.66667L7.33333 10C7.33333 9.26362 6.73638 8.66667 6 8.66667Z" fill="currentColor"></path>
                  <path d="M10 8.66667L8.66667 8.66667L8.66667 10C8.66667 9.26362 9.26362 8.66667 10 8.66667Z" fill="currentColor"></path>
                </svg>
              </div>
            </button>
          </div>
        </nav>
      </div>
    </header>
  </div>

  <section class="cloneable">
    <!-- Neutral Geometric Background Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="background-graphic">
      <path d="M12 2v20M2 12h20M5.636 5.636l12.728 12.728M5.636 19.364L18.728 5.636" stroke-linecap="round"/>
    </svg>

    <div data-nav="closed" class="nav">
      <div data-menu-toggle="" class="overlay"></div>
      <nav class="menu">
        <div class="menu-bg">
          <div class="bg-panel first"></div>
          <div class="bg-panel second"></div>
          <div class="bg-panel"></div>
        </div>
        <div class="menu-inner">
          <ul class="menu-list">
            <li class="menu-list-item">
              <a href="javascript:void(0)" class="menu-link w-inline-block">
                <p class="menu-link-heading">About Us</p>
                <p class="eyebrow">01</p>
                <div class="menu-link-bg"></div>
              </a>
            </li>
            <li class="menu-list-item">
              <a href="javascript:void(0)" class="menu-link w-inline-block">
                <p class="menu-link-heading">Portfolio</p>
                <p class="eyebrow">02</p>
                <div class="menu-link-bg"></div>
              </a>
            </li>
            <li class="menu-list-item">
              <a href="javascript:void(0)" class="menu-link w-inline-block">
                <p class="menu-link-heading">Services</p>
                <p class="eyebrow">03</p>
                <div class="menu-link-bg"></div>
              </a>
            </li>
            <li class="menu-list-item">
              <a href="javascript:void(0)" class="menu-link w-inline-block">
                <p class="menu-link-heading">Journal</p>
                <p class="eyebrow">04</p>
                <div class="menu-link-bg"></div>
              </a>
            </li>
            <li class="menu-list-item">
              <a href="javascript:void(0)" class="menu-link w-inline-block">
                <p class="menu-link-heading">Contact</p>
                <p class="eyebrow">05</p>
                <div class="menu-link-bg"></div>
              </a>
            </li>
          </ul>
          <div class="menu-details">
            <p data-menu-fade="" class="p-small">Socials</p>
            <div class="socials-row">
              <a data-menu-fade="" href="javascript:void(0)" class="p-large text-link">Instagram</a>
              <a data-menu-fade="" href="javascript:void(0)" class="p-large text-link">LinkedIn</a>
              <a data-menu-fade="" href="javascript:void(0)" class="p-large text-link">X / Twitter</a>
              <a data-menu-fade="" href="javascript:void(0)" class="p-large text-link">Behance</a>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script>
    gsap.registerPlugin(CustomEase);

    // Hide navigation wrap initially
    gsap.set(".nav", { display: "none" });

    // Custom easing curve for the organic sliding effect
    CustomEase.create("main", "0.65, 0.01, 0.05, 0.99");

    gsap.defaults({
      ease: "main",
      duration: 0.7
    });

    function initMenu() {
      let navWrap = document.querySelector(".nav");
      let overlay = navWrap.querySelector(".overlay");
      let menu = navWrap.querySelector(".menu");
      let bgPanels = navWrap.querySelectorAll(".bg-panel");
      let menuToggles = document.querySelectorAll("[data-menu-toggle]");
      let menuLinks = navWrap.querySelectorAll(".menu-link");
      let fadeTargets = navWrap.querySelectorAll("[data-menu-fade]");
      let menuButton = document.querySelector(".menu-button");
      let menuButtonTexts = menuButton.querySelectorAll("p");
      let menuButtonIcon = menuButton.querySelector(".menu-button-icon");

      let tl = gsap.timeline();

      // Open navigation menu sequence
      const openNav = () => {
        navWrap.setAttribute("data-nav", "open");
        
        tl.clear()
        .set(navWrap, { display: "block" })
        .set(menu, { xPercent: 0 }, "<")
        .fromTo(menuButtonTexts, { yPercent: 0 }, { yPercent: -100, stagger: 0.2 })
        .fromTo(menuButtonIcon, { rotate: 0 }, { rotate: 315 }, "<")
        .fromTo(overlay, { autoAlpha: 0 }, { autoAlpha: 1 }, "<")
        .fromTo(bgPanels, { xPercent: 101 }, { xPercent: 0, stagger: 0.12, duration: 0.575 }, "<")
        .fromTo(menuLinks, { yPercent: 140, rotate: 10 }, { yPercent: 0, rotate: 0, stagger: 0.05 }, "<+=0.35")
        .fromTo(fadeTargets, { autoAlpha: 0, yPercent: 50 }, { autoAlpha: 1, yPercent: 0, stagger: 0.04 }, "<+=0.2");
      }

      // Close navigation menu sequence
      const closeNav = () => {
        navWrap.setAttribute("data-nav", "closed");
        
        tl.clear()
        .to(overlay, { autoAlpha: 0 })
        .to(menu, { xPercent: 120 }, "<")
        .to(menuButtonTexts, { yPercent: 0 }, "<")
        .to(menuButtonIcon, { rotate: 0 }, "<")
        .set(navWrap, { display: "none" });
      }

      // Toggle menu based on click trigger
      menuToggles.forEach((toggle) => {
        toggle.addEventListener("click", () => {
          let state = navWrap.getAttribute("data-nav");
          if (state === "open") {
            closeNav();
          } else {
            openNav();
          }
        });
      });

      // Accessibility: close menu when hitting the Escape key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && navWrap.getAttribute("data-nav") === "open") {
          closeNav();
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initMenu();
    });
  </script>
</body>
</html>
