<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agency – HTML CSS JS GSAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:300,400,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="row v-center space-between">
        <div class="logo">
          <a href="/" data-route="/">AGENCY</a>
        </div>
        <div class="nav-toggle">
          <button class="hamburger-menu" aria-label="Open menu">
            <span></span>
            <span></span>
          </button>
          <button class="hamburger-menu-close" aria-label="Close menu">
            <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
              <line id="Line_1" y1="14.91" transform="translate(32 24.788)" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
              <path id="Path_1" d="M6,9.155,10.949,5" transform="translate(21.051 19.302)" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
              <path id="Path_2" d="M10.949,5,15.9,9.155" transform="translate(21.051 19.302)" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
              <circle id="circle" cx="32" cy="32" r="30.75" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="App">
    <div class="intro-overlay">
      <div class="top">
        <div class="overlay-top"></div>
        <div class="overlay-top"></div>
        <div class="overlay-top"></div>
      </div>
      <div class="bottom">
        <div class="overlay-bottom"></div>
        <div class="overlay-bottom"></div>
        <div class="overlay-bottom"></div>
      </div>
    </div>

    <div id="page-root"></div>
  </div>

  <nav>
    <div class="container">
      <div class="nav-columns">
        <div class="nav-column">
          <div class="nav-label">Menu</div>
          <ul class="nav-links">
            <li><a href="/case-studies" data-route="/case-studies">Case Studies</a></li>
            <li><a href="/approach" data-route="/approach">Approach</a></li>
            <li><a href="/services" data-route="/services">Services</a></li>
            <li><a href="/about-us" data-route="/about-us">About us</a></li>
          </ul>
        </div>
        <div class="nav-column">
          <div class="nav-label">Contact</div>
          <div class="nav-infos">
            <ul class="nav-info">
              <li class="nav-info-label">Email</li>
              <li><a href="/contact" data-inline="true">Get in touch with us</a></li>
              <li><a href="/audit" data-inline="true">Get a free audit</a></li>
            </ul>
            <ul class="nav-info">
              <li class="nav-info-label">Headquarter</li>
              <li>Route du Jura 49</li>
              <li>1700 Fribourg</li>
              <li>Switzerland</li>
            </ul>
            <ul class="nav-info">
              <li class="nav-info-label">Phone</li>
              <li>+41 (0) 79 510 28 70</li>
            </ul>
            <ul class="nav-info">
              <li class="nav-info-label">Legal</li>
              <li>Privacy & Cookies</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <template id="home-template">
    <div class="home-page">
      <section class="main">
        <div class="container">
          <div class="row">
            <h2>
              <div class="line"><span>Creating unique brands is</span></div>
              <div class="line"><span>what we do.</span></div>
            </h2>
            <div class="btn-row">
              <a href="/about-us" data-route="/about-us">
                More about us
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </section>

      <section class="cases">
        <div class="container-fluid">
          <div class="cases-navigation">
            <div class="cases-arrow prev disabled" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
            </div>
            <div class="cases-arrow next" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </div>
          <div class="row">
            <div class="case">
              <div class="case-details">
                <span>Curology</span>
                <h2>A custom formula for your skin’s unique needs</h2>
              </div>
              <div class="case-image">
                <img src="assets/curology-min.png" alt="Curology">
              </div>
            </div>

            <div class="case">
              <div class="case-details">
                <span>Yourspace</span>
                <h2>Open space floor plans for you next venture</h2>
              </div>
              <div class="case-image">
                <img src="assets/yourspace-min.png" alt="Yourspace">
              </div>
            </div>

            <div class="case">
              <div class="case-details">
                <span>Lumin</span>
                <h2>For your best look ever</h2>
              </div>
              <div class="case-image">
                <img src="assets/lumin-min.png" alt="Lumin">
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </template>

  <template id="simple-page-template">
    <div class="page">
      <div class="container">
        <div class="row">
          <h3 class="page-title"></h3>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
