.w-nav {
  position: relative;
  background: #dddddd;
  z-index: 1000;
}
.w-nav:before,
.w-nav:after {
  content: " ";
  display: table;
  grid-column-start: 1;
  grid-row-start: 1;
  grid-column-end: 2;
  grid-row-end: 2;
}
.w-nav:after {
  clear: both;
}
.w-nav-brand {
  position: relative;
  float: left;
  text-decoration: none;
  color: #333333;
}
.w-nav-link {
  position: relative;
  display: inline-block;
  vertical-align: top;
  text-decoration: none;
  color: #222222;
  padding: 20px;
  text-align: left;
  margin-left: auto;
  margin-right: auto;
}
.w-nav-link.w--current {
  color: #0082f3;
}
.w-nav-menu {
  position: relative;
  float: right;
}
[data-nav-menu-open] {
  display: block !important;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #C8C8C8;
  text-align: center;
  overflow: visible;
  min-width: 200px;
}
.w--nav-link-open {
  display: block;
  position: relative;
}

.w-nav[data-animation='over-left'] [data-nav-menu-open] {
  right: auto;
  z-index: 1;
  top: 0;
}

.w-nav[data-animation='over-right'] [data-nav-menu-open] {
  left: auto;
  z-index: 1;
  top: 0;
}
.w-nav-button:focus {
  outline: 0;
}
.w-nav[data-collapse='all'] .w-nav-menu {
  display: none;
}
.w--nav-dropdown-open {
  display: block;
}
.w--nav-dropdown-toggle-open {
  display: block;
}
.w--nav-dropdown-list-open {
  position: static;
}
/**
 * NOTE: These rules are overridden in site-designer.less to use container queries instead of media queries
 * when the navbar is inside a Frame on the Open Canvas.
 */

  .w-nav[data-collapse='medium'] .w-nav-menu {
    display: none;
  }
}
@media screen and (max-width: 767px) {
  .w-nav[data-collapse='small'] .w-nav-menu {
    display: none;
  }
  .w-nav-brand {
    padding-left: 10px;
  }
}
@media screen and (max-width: 479px) {
  .w-nav[data-collapse='tiny'] .w-nav-menu {
    display: none;
  }
}
.w-tab-link:focus {

}
.w--tab-active {

}

/* ---------------------------------------------------------------------------
   OSMO scaling-hamburger navigation (tablet + mobile)
   Pattern: the pill lives INSIDE the navbar (absolute) so the navbar keeps
   its natural height; on activation the bg scales up to reveal the menu card
   anchored at top-right. A separate fixed sibling (.navigation__dark-bg)
   dims the page behind. State lives on <html data-navigation-status> so
   both elements (inside + outside the navbar) react together.
   Adapted from the OSMO snippet provided by the user.
   --------------------------------------------------------------------------- */

/* Anchor wrapper inside the navbar flex row — reserves 2.75em × 2.75em so the
   navbar's natural height tracks the pill, and provides the positioning
   context for the absolute .hamburger-nav inside. overflow:visible lets the
   expanded card stick out below the navbar. flex-shrink:0 prevents the
   anchor from collapsing under flex pressure. */
.hamburger-anchor {
  position: relative;
  width: 2.75em;
  height: 2.75em;
  font-size: 1rem;
  overflow: visible;
  flex-shrink: 0;
}

.navigation__dark-bg {
  transition: opacity 0.7s cubic-bezier(0.5, 0.5, 0, 1), visibility 0.7s cubic-bezier(0.5, 0.5, 0, 1);
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
  background-color: var(--brand--neutral-dark);
  position: fixed;
  inset: 0;
  z-index: 999;
}

[data-navigation-status="active"] .navigation__dark-bg {
  opacity: 0.33;
  visibility: visible;
  pointer-events: auto;
}

.hamburger-nav {
  border-radius: 1.25rem;
  position: absolute;
  top: 0;
  right: 0;
  font-size: 1rem;
}

.hamburger-nav__bg {
  transition: all 0.7s cubic-bezier(0.5, 0.5, 0, 1);
  background-color: var(--brand--secondary);
  border-radius: 1rem;
  width: 2.75em;
  height: 2.75em;
  position: absolute;
  top: 0;
  right: 0;
}

[data-navigation-status="active"] .hamburger-nav__bg {
  width: 100%;
  height: 100%;
  border-radius: 1.25rem;
}

.hamburger-nav__group {
  transition: opacity 0.5s cubic-bezier(0.5, 0.5, 0, 1), transform 0.7s cubic-bezier(0.5, 0.5, 0, 1), visibility 0.7s cubic-bezier(0.5, 0.5, 0, 1);
  gap: 1em;

}

.hamburger-nav__li {

}

.hamburger-nav__a {

.hamburger-nav__dot {

.hamburger-nav__toggle {

/* ---------------------------------------------------------------------------
   Button is-primary — OSMO button-009 hover pattern adapted to Advisora.
   The Webflow markup ships an <img class="button-icon"> after .button-text-wrap;
   we keep it as a real flex child (so the button auto-expands and the arrow
   never collides with the text), animate it with translate/opacity on hover,
   and add a mirrored ::before for the left arrow that slides in from the
   padding-left zone. Combined with the existing scale .975 from webflow.css:4229.
   Same timing/easing across every .button.is-primary so all CTAs feel like
   one component (one CSS rule → all instances).
   --------------------------------------------------------------------------- */
.button.is-primary {
  position: relative;
  gap: 0.5rem;
}

.button.is-primary .button-icon {
  display: block;
  width: 1.125rem;
  height: 1.125rem;
  margin: 0;
  flex: none;
  align-self: center;
  transition: translate 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s ease-out;
}

.button.is-primary::before {
  content: "";
  position: absolute;
  left: 1.5rem;
  top: 50%;
  width: 1.125rem;
  height: 1.125rem;
  background-image: url("https://d173woph5zl366.cloudfront.net/advisora/images/arrow-right.svg");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  translate: -1.25em -50%;
  opacity: 0;
  pointer-events: none;
  z-index: 1;
  transition: translate 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s ease-out;
}

.button.is-primary .button-text-wrap {
  transition: translate 0.5s cubic-bezier(0.32, 0.72, 0, 1);
}

@media (hover: hover) and (pointer: fine) {
  .button.is-primary:hover .button-icon {
    translate: 1.5em 0;
    opacity: 0;
    transition: translate 0.5s 0.05s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s 0.075s ease-out;
  }

  .button.is-primary:hover::before {
    translate: 0 -50%;
    opacity: 1;
    transition: translate 0.5s 0.075s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s 0.075s ease-out;
  }

  /* Shift text-wrap right by (icon-size + gap) so it clears the incoming
     left arrow without overlapping. */
  .button.is-primary:hover .button-text-wrap {
    translate: 1.625rem 0;
    transition: translate 0.5s 0.075s cubic-bezier(0.32, 0.72, 0, 1);
  }
}

/* ---------------------------------------------------------------------------
   Footer links wrapper — equal 3-column grid on desktop + tablet
   Webflow default at ≥992px uses flex space-between, which pins the rightmost
   column to the far edge. Switch to grid so the 3 groups sit in equal 1fr
   columns and the right-side links align with their column start, not the
   container edge. Tablet already overrides to grid 1fr×3 (webflow.css:10008);
   mobile keeps the 2-col grid override (webflow.css:11126).
   --------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
   Link hover polish — adapted from a-33/a-34 (IX2 mouseover/out → plain CSS).

   Navbar (desktop): Webflow base sets `.nav_links { opacity: .8 }` and
   `:hover { opacity: 1 }`. We layer "focus the hovered link, dim its siblings"
   by lowering :not(:hover) opacity while the parent list is hovered. The
   hovered link inherits Webflow's :hover (opacity 1, full dark).

   Footer + dropdown: keep the simple opacity fade-on-hover.
   --------------------------------------------------------------------------- */
.nav_links {

/* ---------------------------------------------------------------------------

   The parent `*-card-image` already has `overflow: clip` + border-radius, so
   the scaled image stays bounded. Covers both blog card variants used in the
   template: the teaser (.slider-blogs_card) and the /blog grid (.articles_card).
   Update once → applies to every blog card.
   --------------------------------------------------------------------------- */

@media (hover: hover) and (pointer: fine) {

   --------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
   Hero load — CSS keyframes "escalera" pattern (Coverly default).
   Two visual groups (left content + right visual) animate IN PARALLEL, each

@keyframes hero-reveal-in {

    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
