<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Specialists — Fanned Card Hero</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="specialists">
      <div class="specialists__panel">
        <div class="specialists__cards">
          <ul class="specialists__deck specialists__deck--desktop">
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-1.webp" alt="Dr. Sarah Jenkins, Cardiologist" loading="lazy" decoding="async" />
                <figcaption class="specialists__card-info">
                  <h3 class="specialists__card-name">Sarah Jenkins</h3>
                  <p class="specialists__card-role">Cardiologist</p>
                </figcaption>
              </figure>
            </li>
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-2.webp" alt="Dr. David Chen, Neurologist" loading="lazy" decoding="async" />
                <figcaption class="specialists__card-info">
                  <h3 class="specialists__card-name">David Chen</h3>
                  <p class="specialists__card-role">Neurologist</p>
                </figcaption>
              </figure>
            </li>
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-3.webp" alt="Dr. Emily Davis, Pediatrician" loading="lazy" decoding="async" />
                <figcaption class="specialists__card-info">
                  <h3 class="specialists__card-name">Emily Davis</h3>
                  <p class="specialists__card-role">Pediatrician</p>
                </figcaption>
              </figure>
            </li>
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-4.webp" alt="Dr. Tyler Matthews, Acquisition Manager" loading="lazy" decoding="async" />
                <figcaption class="specialists__card-info">
                  <h3 class="specialists__card-name">Tyler Matthews</h3>
                  <p class="specialists__card-role">Acquisition Manager</p>
                </figcaption>
              </figure>
            </li>
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-5.webp" alt="Dr. Michael Scott, Oncologist" loading="lazy" decoding="async" />
                <figcaption class="specialists__card-info">
                  <h3 class="specialists__card-name">Michael Scott</h3>
                  <p class="specialists__card-role">Oncologist</p>
                </figcaption>
              </figure>
            </li>
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-6.webp" alt="Dr. Jessica Lee, Dermatologist" loading="lazy" decoding="async" />
                <figcaption class="specialists__card-info">
                  <h3 class="specialists__card-name">Jessica Lee</h3>
                  <p class="specialists__card-role">Dermatologist</p>
                </figcaption>
              </figure>
            </li>
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-7.webp" alt="Dr. Robert Wilson, Orthopedic Surgeon" loading="lazy" decoding="async" />
                <figcaption class="specialists__card-info">
                  <h3 class="specialists__card-name">Robert Wilson</h3>
                  <p class="specialists__card-role">Orthopedic Surgeon</p>
                </figcaption>
              </figure>
            </li>
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors.webp" alt="Dr. Olivia Martinez, Psychiatrist" loading="lazy" decoding="async" />
                <figcaption class="specialists__card-info">
                  <h3 class="specialists__card-name">Olivia Martinez</h3>
                  <p class="specialists__card-role">Psychiatrist</p>
                </figcaption>
              </figure>
            </li>
          </ul>

          <ul class="specialists__deck specialists__deck--mobile" aria-hidden="true">
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-3.webp" alt="" loading="lazy" decoding="async" />
              </figure>
            </li>
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-4.webp" alt="" loading="lazy" decoding="async" />
              </figure>

            <li class="specialists__card">
              <figure class="specialists__card-inner">

              </figure>
            </li>
            <li class="specialists__card">
              <figure class="specialists__card-inner">
                <img class="specialists__card-img" src="https://d173woph5zl366.cloudfront.net/medical-specialists-fan/doctors-6.webp" alt="" loading="lazy" decoding="async" />
              </figure>
            </li>
          </ul>
        </div>

        <header class="specialists__header">
          <h2 class="specialists__title">
            The specialists your patients deserve are closer than you think.
          </h2>
          <p class="specialists__subtitle">
            We connect you with the most qualified medical professionals, so your team is always in the best hands.
          </p>
        </header>
      </div>
    </section>
    <script type="module" src="script.js"></script>
  </body>
</html>
