<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stayli — CTA</title>

  <!-- Fonts: Inter (replaces the template's @fontsource/inter). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Flag the document before first paint so scroll-reveal start states only
       apply when scripting is on (content stays visible if JS is disabled). -->
  <script>document.documentElement.classList.add("reveal-js");</script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="section_cta">
      <div class="cta_img-wrap">
        <img
          src="https://d173woph5zl366.cloudfront.net/stayli/images/cta-img_1cta-img.webp"
          loading="lazy"
          sizes="100vw"
          srcset="https://d173woph5zl366.cloudfront.net/stayli/images/cta-img_1cta-img.webp 500w, https://d173woph5zl366.cloudfront.net/stayli/images/cta-img_1cta-img.webp 800w, https://d173woph5zl366.cloudfront.net/stayli/images/cta-img_1cta-img.webp 1080w, https://d173woph5zl366.cloudfront.net/stayli/images/cta-img_1cta-img.webp 1600w, https://d173woph5zl366.cloudfront.net/stayli/images/cta-img_1cta-img.webp 2000w, https://d173woph5zl366.cloudfront.net/stayli/images/cta-img_1cta-img.webp 2560w"
          alt=""
          class="img"
        />
      </div>
      <div class="cta_content">
        <div class="padding-global is-cta">
          <div class="container-large">
            <div class="cta_content-internal">
              <h2 class="heading-style-h1" data-reveal>Find a home away from home!</h2>
              <a href="/listings" class="button w-button" data-reveal>List Your Property</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="scroll-reveal.js"></script>
  <script src="./script.js"></script>
</body>
</html>
