html {
  height: 100%;
}
body {
  margin: 0;
  min-height: 100%;
  background-color: #fff;
  font-family: Arial, sans-serif;

  line-height: 20px;

}

}

}

  font-size: 24px;

  margin-top: 20px;
}

  display: none;
  padding: 20px;
  text-align: center;
  background-color: #dddddd;
}

  display: none;
  margin-top: 10px;
  padding: 10px;
  background-color: #ffdede;
}
.w-input:focus,
.w-select:focus {
  border-color: #3898EC;
  outline: 0;
}
.w-slider-dot:focus {
  outline: none;

}
.w-slider-dot:focus.w-active {
  box-shadow: none;
}
.w-slider-arrow-left:focus,
.w-slider-arrow-right:focus {
  outline: 0;
}
.w-dropdown-toggle:focus {
  outline: 0;
}
.w-dropdown-link:focus {
  outline: 0;
}
/**
 * ## Note
 * Safari (on both iOS and OS X) does not handle viewport units (vh, vw) well.
 * For example percentage units do not work on descendants of elements that
 * have any dimensions expressed in viewport units. It also doesn’t handle them at
 * all in `calc()`.
 */
/**
 * Wrapper around all lightbox elements
 *

 *    underneath the lightbox.
 */
/**
 * Neat trick to bind the rubberband effect to our canvas instead of the whole
 * document on iOS. It also prevents a bug that causes the document underneath to scroll.
 */

/*
 * 1. Remove default margin set by user-agent on the <figure> element.
 */
/**
 * IE adds image dimensions as width and height attributes on the IMG tag,
 * but we need both width and height to be set to auto to enable scaling.
 */
/**
 * 1. Reset if style is set by user on "All Images"
 */
/*
 * Without specifying the with and height inside the SVG, all versions of IE render the icon too small.

 */
/**
 * 1. All IE versions add extra space at the bottom without this.

 *    the parent is also rendered on the GPU (by setting translate3d for
 *    example) fixes this behavior.
 */

   the photo BELOW the name/role/bio/socials so the Join section follows it naturally.

/* ──────────────────────────────────────────────────────────────────────────
   Responsive heading scale (global typography fix)

   Problem: this template decouples semantic tag from visual class (Client-First
   pattern: a page H1 may carry class .h3, a section H2 may carry class .h1, etc.).
   On desktop that intent is fine, but webflow.css's responsive token blocks
   collapsed .h3/.h4/.h5 onto the SAME `huge` (2rem) value at ≤767/≤479 and let
   the page-title classes (.h3 / .text-6xl, ~2rem) shrink BELOW larger section
   classes — inverting the visual hierarchy on mobile/tablet.

   Fix: redefine the six heading font-size TOKENS with a clean, strictly
   monotonic ramp at each breakpoint (h1 > h2 > h3 > h4 > h5 > h6), and keep the
   page-h1 floor at 2.25rem so it never shrinks to an awkward size. Because every
   .h1–.h6 / .text-* class resolves its size from these tokens, fixing the tokens
   fixes the scale everywhere. Loaded after webflow.css; `:root` (specificity
   0,1,0) wins over webflow's `body {}` blocks (0,0,1). Desktop is UNCHANGED.
   ────────────────────────────────────────────────────────────────────────── */

/* ──────────────────────────────────────────────────────────────────────────
   Slider arrow press feedback (Phase 5B): scale 0.95 on hover AND while pressed.
   Covers every `.arrow-group` prev/next (grid sliders + home testimonials). These
   buttons carry no other transform, so a plain scale is safe. The About
   testimonials use a different `.arrow` element (its own scoped rule). */
.arrow-group > .swiper-button-prev,
.arrow-group > .swiper-button-next {
  transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.arrow-group > .swiper-button-prev:hover,
.arrow-group > .swiper-button-next:hover,
.arrow-group > .swiper-button-prev:active,
.arrow-group > .swiper-button-next:active {
  transform: scale(0.95);
}

/* About-testimonials chevrons use the `.arrow` element instead. On desktop they
   take webflow.css's base `.arrow:hover { scale(.97) translate(±60%) }`; bump to
   0.95 and add :active, preserving the side-positioning translate. (≤479px is
   handled by the component's own scoped block.) Loads after webflow.css → wins. */
.arrow:hover,
.arrow:active {
  transform: scale(0.95) translate(-60%);
}
.arrow.is-right:hover,
.arrow.is-right:active {
  transform: scale(0.95) translate(60%);
}

/* ──────────────────────────────────────────────────────────────────────────
   Team card hover (a-42/43, Phase 5B): the photo zooms inside its clipped wrapper
   (.team_card-img is overflow:clip — like the blog cards), and the arrow self-swaps
   inside its icon box: is-one shoots out top-right while the parked is-two flies in
   to centre. (Source IX2 scaled the whole card; per Edgar only the image zooms — so
   nothing overflows the cell, no grid-overflow/z-index workaround needed.) */
.team_card-img .img {
  transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}
.team_card:hover .team_card-img .img {
  transform: scale(1.1);
}
.team_arrow {
  transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}
.team_arrow.is-two {
  transform: translate(-150%, 150%); /* rest: parked off bottom-left (clipped) */
}
.team_card:hover .team_arrow.is-one {
  transform: translate(150%, -150%); /* shoots out top-right */
}
.team_card:hover .team_arrow.is-two {
  transform: translate(0%, 0%); /* flies in to centre */
}

/* ──────────────────────────────────────────────────────────────────────────
   Footer link hover (a-59/60): tween to the neon accent (.footer_link already
   transitions colour in webflow.css). */
.footer_link:hover {
  color: var(--base--neon-green);
}

/* ──────────────────────────────────────────────────────────────────────────
   Social icon buttons (contact "Follow Us" + footer): on hover the wrap fills
   with the neon accent and scales up; the SVG icon — an <img> (white in contact,
   light-green #D8FF85 in footer), so not CSS-colourable via fill — is flipped to
   black with `filter: brightness(0)` so it stays high-contrast on the bright fill.
   A light icon on a light bg would vanish; inverting it keeps the contrast. */
.social-icons_grid .card-icon-wrap:hover,
.footer_icon-wrap:hover {

  transform: scale(1.1);
}
.social-icons_grid .card-icon-wrap:hover .card-icon,
.footer_icon-wrap:hover .footer_social {

}

/* ──────────────────────────────────────────────────────────────────────────

   restyled to Upmind (dark-green card, white text, neon current-page dot, Geist).

/* ===== grid-slider.css ===== */
/* =========================================================================
   grid-slider.css — responsive grid→slider enhancement (reviewer request)

   ADDITIVE, source-true. The Webflow source turned several card grids into a
   plain `display:flex; overflow:auto` drag strip on tablet/mobile (no arrows).
   We upgrade those to a real Swiper slider WITH arrows below each grid's own
   degrade breakpoint, while the desktop CSS grid is left exactly as-is and is
   NEVER driven by Swiper.

   Two breakpoint families, matching where the SOURCE grid degraded:
     • default (services, team)  → slider ≤991 / grid ≥992   [no data-slider-mq]
     • expertise, blog list      → slider ≤767 / grid ≥768   [data-slider-mq="767"]

   Markup contract (per target grid):
     <div class="<grid-class> swiper" data-grid-slider data-spv data-gap
          [data-slider-mq="767"]>
       <div class="swiper-wrapper">
         <div class="<item-class> swiper-slide"> …card… </div> …
       </div>
       <div class="arrow-group">
         <div class="swiper-button-prev" data-prev>…</div>
         <div class="swiper-button-next" data-next>…</div>
       </div>
     </div>

   Init/destroy handled by src/scripts/grid-slider.ts (matchMedia per breakpoint).
   ========================================================================= */

/* ---- Shared "is a slider" rules (applied at/below the breakpoint) -------- */
/* These neutralize the source drag-strip rules so Swiper fully controls the
   track, and render the arrow group. Wrapped per-breakpoint below. */

/* === Family A: default grids — slider ≤991, plain grid ≥992 ============== */
@media screen and (min-width: 992px) {
  /* Stay a grid on desktop. Swiper's swiper.css sets .swiper{display:block} and
     .swiper-wrapper{display:flex}; undo both so the source grid layout applies
     straight to the cards. Targets WITHOUT a 767 override (i.e. the 991 family). */
  [data-grid-slider]:not([data-slider-mq="767"]).swiper {
    display: grid;
    /* Neutralize Webflow's `.swiper { grid-gap: xhuge (2.5rem) }` (webflow.css)
       which the slider opt-in class drags onto these grids. Desktop card gap is
       1rem (var medium) for all grid→slider components. */
    column-gap: var(--_sizes---fixed--medium);
    row-gap: var(--_sizes---fixed--medium);
  }
  [data-grid-slider]:not([data-slider-mq="767"]) > .swiper-wrapper {
    display: contents;
  }
  [data-grid-slider]:not([data-slider-mq="767"]) > .arrow-group {
    display: none;
  }
}

@media screen and (max-width: 991px) {
  [data-grid-slider]:not([data-slider-mq="767"]).swiper {
    display: block;
    overflow: hidden;
    margin-left: 0;
    margin-right: 0;
    padding-left: 0;
    padding-right: 0;
  }
  [data-grid-slider]:not([data-slider-mq="767"]) > .swiper-wrapper {
    display: flex;
    align-items: stretch;
  }
  [data-grid-slider]:not([data-slider-mq="767"]) > .swiper-wrapper > .swiper-slide {
    height: auto;
    flex-shrink: 0;
  }
  [data-grid-slider]:not([data-slider-mq="767"]) > .arrow-group {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 2rem;
  }
}

/* === Family B: expertise / blog — slider ≤767, plain grid ≥768 ========== */
@media screen and (min-width: 768px) {
  [data-grid-slider][data-slider-mq="767"].swiper {
    display: grid;
    /* Same 1rem desktop gap fix as the 991 family (see above). */
    column-gap: var(--_sizes---fixed--medium);
    row-gap: var(--_sizes---fixed--medium);
  }
  [data-grid-slider][data-slider-mq="767"] > .swiper-wrapper {
    display: contents;
  }
  [data-grid-slider][data-slider-mq="767"] > .arrow-group {
    display: none;
  }
}

@media screen and (max-width: 767px) {
  [data-grid-slider][data-slider-mq="767"].swiper {
    display: block;
    overflow: hidden;
    margin-left: 0;
    margin-right: 0;
    padding-left: 0;
    padding-right: 0;
  }
  [data-grid-slider][data-slider-mq="767"] > .swiper-wrapper {
    display: flex;
    align-items: stretch;
  }
  [data-grid-slider][data-slider-mq="767"] > .swiper-wrapper > .swiper-slide {
    height: auto;
    flex-shrink: 0;
  }
  [data-grid-slider][data-slider-mq="767"] > .arrow-group {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 2rem;
  }
}

/* ---- Preserve source item display under Swiper -------------------------- */
/* Swiper's swiper.css sets .swiper-slide{display:block}, which flattens the
   source `.expertise_item{display:flex;flex-flow:column;row-gap:xlarge}` to block
   so its icon→title gap collapses to 0 (all viewports). Restore the source
   flex-column (higher specificity than .swiper-slide) so the 1.5rem row-gap
   between the icon and the title applies again — grid item AND slide alike. */

/* ---- Arrow buttons (same look as the testimonial slider arrows) --------- */
/* Swiper's swiper.css absolutely-positions .swiper-button-prev/next and gives
   them their own ::after glyph. Re-anchor them into the static arrow-group row
   and suppress the default glyph so our arrow-left/right SVGs show — mirroring
   how the testimonial slider renders these buttons. Breakpoint-agnostic: only
   ever visible inside a displayed .arrow-group (gated above). */
[data-grid-slider] > .arrow-group > .swiper-button-prev,
[data-grid-slider] > .arrow-group > .swiper-button-next {
  position: static;
  margin: 0;
  inset: auto;
  width: 3rem;
  height: 3rem;
}
[data-grid-slider] > .arrow-group > .swiper-button-prev::after,
[data-grid-slider] > .arrow-group > .swiper-button-next::after {
  content: none;
}


/* ===== reveal.css ===== */
/* Scroll-reveal initial states — paired with scroll-reveal.ts (Phase 5B).
 *
 * Gated on `html.reveal-on` (added by an inline <head> script before first paint,
 * Webflow `w-mod-js` style) so the hidden state applies ONLY when JS is running.
 * JS off  → class never added → content visible (no FOUC, no blank page).
 *
 * The media query MUST match scroll-reveal.ts exactly: only desktop with motion
 * allowed hides anything. On ≤991px the card grids become Swiper sliders, so a
 * hidden initial state would blank off-screen slides — reveals are desktop-only. */
@media (min-width: 992px) and (prefers-reduced-motion: no-preference) {
  html.reveal-on .scroll-into-view,
  html.reveal-on [data-reveal] {
    opacity: 0;
    transform: translateY(0.9375rem); /* 15px @ 16px root — source slideInUp */
  }

  html.reveal-on [data-reveal-img] {
    transform: scale(1.5); /* source scaleIn (a-61) */
  }

  html.reveal-on [data-reveal-rotate] {
    opacity: 0;
    transform: rotate(-5deg); /* source rotateIn (a-35) */
  }

  /* join social-proof avatars + "+20k customers" label: pre-shift right + hidden;
     scroll-reveal.ts staggers them back to x:0 (slide in from the right). */
}

/* Page-load intro guard — paired with hero-load.ts. No !important so gsap.set wins.
 * NOT gated on min-width: the hero/nav intro runs on all viewports (load, not scroll
 * → no grid-slider conflict). Source kept these `visibility:hidden` until JS ran. */
@media (prefers-reduced-motion: no-preference) {
  html.reveal-on [data-navbar] {
    visibility: hidden;
  }
  /* Hero image: scale-only entrance — ALWAYS visible (no opacity/visibility), just
     zooms. Pre-scale here so it's zoomed before first paint (no flash); hero-load.ts
     animates it back to 1. Masked by the wrapper's overflow:clip. */
}
