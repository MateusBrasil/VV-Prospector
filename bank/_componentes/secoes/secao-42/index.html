<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congra — CTA</title>

  <!-- Gate de animaciones: .anim en <html> pre-pinta los reveals (opacity:0)
       solo cuando el visitante permite motion. Igual que el BaseLayout del template. -->
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('anim');
    }
  </script>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-wrapper">
    <main class="main-wrapper">
      <section class="section_cta">
        <div class="padding-section-small"></div>
        <div class="padding-global">
          <div class="container-large">
            <div class="cta slide_down">
              <div class="max-title is-40rem">
                <h2 class="slide-left">Ready to upgrade your tech stack?</h2>
              </div>
              <div class="slide-left">
                <a data-wf--button--variant="base" href="/#pricing" class="button w-inline-block">
                  <div class="button_left">
                    <div class="clip_intro">
                      <div class="button_banner-text">
                        <div class="button_text">get a ticket</div>
                      </div>
                      <div class="button_banner-text is-bottom">
                        <div class="button_text text-color-primary">get a ticket</div>
                      </div>
                    </div>
                    <div class="button_cover"></div>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
        <div class="padding-section-small"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="animations.js"></script>
  <script src="./script.js"></script>



    <script data-reveal-on-view="">(function(){var n=0;function d(){var S=window.ScrollTrigger;if(!S){if(n++<60)setTimeout(d,50);return;}var L=S.getAll().filter(function(t){return t.trigger&&t.animation&&!(t.vars&&(t.vars.scrub||t.vars.pin));});if(!L.length){if(n++<60)setTimeout(d,50);return;}var io=("IntersectionObserver"in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;io.unobserve(e.target);var a=e.target.__rv;if(a)a.play();});},{threshold:0,rootMargin:"0px 0px -8% 0px"}):null;L.forEach(function(t){var a=t.animation,g=t.trigger;t.kill(false,true);if(!io){a.play();return;}if(a.progress()<1)a.pause(0);g.__rv=a;io.observe(g);});}if(document.readyState==="complete")setTimeout(d,30);else window.addEventListener("load",function(){setTimeout(d,30);});})();</script>
  </body></html>
