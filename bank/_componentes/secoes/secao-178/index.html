html {
  height: 100%;
}
body {
  margin: 0;
  min-height: 100%;
  background-color: #fff;
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 20px;
  color: #333;
}
img {
  max-width: 100%;
  vertical-align: middle;
  display: inline-block;
}
html[data-w-dynpage] [data-w-cloak] {
  color: transparent !important;
}

h2,
h3,
h4 {
  font-weight: bold;
  margin-bottom: 10px;
}
h2 {
  font-size: 32px;
  line-height: 36px;
  margin-top: 20px;
}
h3 {
  font-size: 24px;
  line-height: 30px;
  margin-top: 20px;
}
h4 {
  font-size: 18px;
  line-height: 24px;
  margin-top: 10px;
}
.w-form-done {
  display: none;
  padding: 20px;
  text-align: center;
  background-color: #dddddd;
}
.w-form-fail {
  display: none;
  margin-top: 10px;
  padding: 10px;
  background-color: #ffdede;
}
.w-input:focus,
.w-select:focus {
  border-color: #3898EC;
  outline: 0;
}
.w-slider-dot:focus {
  outline: none;
  box-shadow: 0px 0px 0px 2px #fff;
}
.w-slider-dot:focus.w-active {
  box-shadow: none;
}
.w-slider-arrow-left:focus,
.w-slider-arrow-right:focus {
  outline: 0;
}
.w-dropdown-toggle:focus {
  outline: 0;
}
.w-dropdown-link:focus {
  outline: 0;
}

/* =============================================================================
   hamburger-nav.css — OSMO scaling hamburger (webflow-to-astro skill default)
   -----------------------------------------------------------------------------
   Extraído fielmente de Upmind (src/styles/components.css, 2026-06-01).
   AUTOCONTENIDO: sin tokens de Upmind. Los colores se leen de CSS vars con
   fallback — sobreescribilas desde el proyecto destino:
     --navbar-menu-bg     fondo del pill/card     (default #101604)
     --navbar-menu-fg     texto del menú          (default #ffffff)
     --navbar-accent      dot de la página activa (default #b7fe02)
     --navbar-menu-font   familia del menú         (default sans-serif)
     --navbar-menu-font-mono  familia del label "Menu" (default monospace)

   MECÁNICA (CSS-only, sin GSAP): el estado vive en <html data-navigation-status>
   ("active" / "not-active"), seteado por navbar.ts. Todo lo demás son transiciones
   CSS keyed off ese atributo:
     - .hamburger-nav__bg     pill 2.75em → card 100% (bg scale)
     - .hamburger-nav__group  contenido scale(0.15) → scale(1) (content scale)
     - .hamburger-nav__toggle dos barras → X (rotate 45/-45)
     - .hamburger-nav__dot    aparece scale(1) en el link aria-current / hover
   Easing compartido: cubic-bezier(0.5, 0.5, 0, 1).

   HOOKS (markup → CSS/JS):
     .hamburger-anchor          contenedor que reserva espacio en la fila flex
     [data-navigation-toggle="toggle"]  botón (abre/cierra) — navbar.ts
     [data-navigation-toggle="close"]   backdrop (cierra)   — navbar.ts
     [data-navigation-status] en <html>  estado global — navbar.ts
   ============================================================================= */

/* --- Visibilidad responsive: el hamburger + backdrop solo ≤991 ---
   Desktop (≥992) usa los inline links, así que el hamburger se oculta ahí.
   El .navigation__dark-bg es el dim backdrop (sibling fixed del navbar). */

/* --- Anchor: reserva 2.75em en la fila flex; el card crece por fuera (overflow visible) --- */

/* --- Backdrop: fixed, oscurece la página al abrir el menú --- */

/* --- El pill OSMO --- */

/* bg scale: el pill 2.75em se expande a 100% (cubre toda la card) al activar */

/* content scale: el contenido del menú scale(0.15)→scale(1) desde la esquina top-right */

/* label "Menu" (mono, uppercase) */
/* link de la página activa: texto atenuado (a11y: aria-current="page") */

/* dot accent: invisible por default (scale 0); aparece en aria-current y en hover */
/* al hacer hover sobre cualquier link, el dot de la página activa se oculta... */
/* ...y aparece en el link hovereado */
.hamburger-nav .hamburger-nav__a:hover .hamburger-nav__dot {
  transform: scale(1);

}

/* --- Toggle: dos barras → X --- */

/* ---------------------------------------------------------------------------
   Hero load entrance — GSAP-driven (scripts/hero-intro.ts), faithful to the
   webflow wf:load timeline t-9920b7cb (the new IX3/GSAP system, not IX2):
     [bg]            scale 1.2 → 1              (dur 1,   pos 0)
     zoom            y 2rem→0 + scale 1.1→1     (dur 1,   pos 0)
     hero-heading    SplitText CHARS, y 50% + opacity, stagger 0.5  (pos 0)
     hero-description y 50% + opacity           (pos .3)
     hero-divider    y 50% + opacity            (pos .5)
     hero-button     y 50% + opacity            (dur .45, pos .55)
   ease 2 ≈ power-out. To avoid a flash before the script splits/positions the
   text, hide the hero text layout while JS is on; hero-intro reveals it (and the
   reduced-motion / no-JS paths leave it visible). --------------------------- */

   while JS is on so the clip/char timeline doesn't flash its end state first; the
   reduced-motion / no-JS paths leave it visible. */

   .section_product.is-hero class but uses the reveal.ts scroll reveals instead). */

   little room to drift without baring an edge (why the effect read as nothing). Centre
   a taller 140% crop here so the strengthened ±14 scrub (reveal.ts) has 20% headroom
   each way. Scoped to the CTA — the hero parallaxes are removed, so nothing else needs
   the extra crop. */

/* Button fill hover (S3) — decoded from IX2 timeline t-3ac3571b:
   .button_background slides x -100%→0% (fills) + button text flips to black.
   button-component clips the 150% fill (position+overflow). */
.button-component:hover .button_background {

/* Blog card + testimonial image hover (S4) — decoded from IX2 a-60/a-61
   ("Testimonial Hover", useFirstGroupAsInitialState, outQuart 500ms). Shared by

     .img            scale 1→1.1 + blur 0→5px
     .blog_arrow.is-one  (0,0) → (200%,-200%)   flies up-right, out
