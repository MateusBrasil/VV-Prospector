/* ════════════════════════════════════════════════════════════════════════

   Sizes in rem (root 16px = 1rem, fixed across viewports).
   line-height and letter-spacing are CONSTANT across all breakpoints.
   !important is required because Astro scoped component CSS has higher
   specificity (data-astro-cid attribute) and would otherwise win.
   ════════════════════════════════════════════════════════════════════════ */

/* ── Bucket 68px — display / hero headlines ──────────────────────────────
   Desktop 68 → Tablet 60 → Landscape 50 → Portrait 40                   */

/* ── Bucket 48px — CTA heading ───────────────────────────────────────────
   Desktop 48 (responsive sizes interpolated below)                       */

/* ── Bucket 36px — statement / card titles / quote / service tab name ───
   Desktop 36 → Tablet 32 → Landscape 28 → Portrait 24                   */

/* ── Bucket SPECIAL 36px constant — about stat values ────────────────────
   Stays at 36px on all viewports (no responsive override).               */

/* ── Bucket 24px — testimonial author name / blog card title ─────────────
   Constant 24px on all viewports.                                        */

/* ── Bucket 16px — body / subhead / labels / descriptions ───────────────
   Constant 16px on all viewports.                                        */

  font-size: 1rem !important;          /* 16px */
  line-height: 1.5 !important;
  letter-spacing: 0 !important;
}

/* ── Bucket BUTTON — same metrics as 16px, custom letter-spacing ────────

  line-height: 1.5 !important;
  letter-spacing: 0.008em !important;

/* ── Bucket SECTION BADGE — universal lock for label dot + label text ────
   Every section header uses the same DOM contract:
     <div class="X__label">
       <span class="X__labelDot"></span>
       <span class="X__labelText">Label</span>
     </div>
   The label text locks to 1rem / 1.5 / 0em letter-spacing on EVERY
   viewport (no fluid scaling — these are micro-elements that read better
   at a constant size).
   The dot locks to 0.5rem (8px) square so the visual rhythm of every
   section badge stays identical regardless of which component owns the
   selector. Attribute selectors `[class$="..."]` catch every component
   variant without listing them one by one.                              */

/* ── Number Odometer — digit-rolling counter (Counter pattern) ───────────
   Any element marked with `[data-odometer-element]` has its digits
   replaced at runtime with vertical roller strips. The wrapper around
   such elements gets `[data-odometer-group]` (with optional
   `data-odometer-trigger-start` / `-stagger`). The animation logic lives
   site-wide in BaseLayout.astro, so any page can drop these data
   attributes onto a stat value and get the entrance counter for free —
   no per-component CSS / JS duplication. */
[data-odometer-element] {
  display: inline-flex;
  align-items: center;
  font-variant-numeric: tabular-nums; /* prevent jiggle as digits roll */
}

[data-odometer-element] [data-odometer-part="mask"],
[data-odometer-element] [data-odometer-part="static"] {
  display: inline-block;
  overflow: clip;
  padding: 0.05em;
  margin: -0.05em;
}

[data-odometer-element] [data-odometer-part="roller"] {
  display: block;
  white-space: pre;
  text-align: center;
  will-change: transform;
}

/* ==========================================================================
   Base Utilities
   ========================================================================== */

/* Section eyebrow label — dot + text pattern from Figma (About, Expertise, Services, etc.) */

.section-label::before {
  content: '';
  display: inline-block;
  width: 0.75em;
  height: 0.75em;
  background-color: var(--color-accent);
  border-radius: var(--radius-full);
  flex-shrink: 0;
}

/* Button — primary light (white bg, dark text) per Figma */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.25em;
  width: fit-content;
  /* Padding-driven sizing with a 48px floor — ensures every button meets
     the 48px touch target minimum while keeping the 8/24 rhythm. */
  min-height: 3em;         /* 48px */
  padding: 0.5em 1.5em;    /* 8px 24px */
  background-color: var(--color-bg-white);
  color: var(--color-text-primary);
  font-family: var(--font-body);
  font-size: 1em;
  font-weight: 500;
  line-height: 1.5;
  letter-spacing: -0.128px;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
  position: relative;
  overflow: hidden;        /* clips the ::before circle hover fill */
  transition: opacity var(--transition-base);
}

/* Dark-filled (green) variant of the global `.btn`. Reusable modifier:
   any anchor / button that should read as the "green" CTA gets this class
   in addition to `.btn`. The variant differs from the default light btn
   in three ways:
     1. Surface flips — dark teal background + white text
     2. Hover ripple uses the hero's cream (#f9f9f7) instead of lavender,
        so the surface fades from teal → cream as the disc grows
     3. A 2px border draws on hover in dark teal — the button reads as a
        recessed outline once the cream fills it
   The border lives at rest as `2px solid transparent` so the layout box
   already accounts for the border footprint; toggling `border-color` on
   hover doesn't shift surrounding content. */
.btn--dark {
  background-color: var(--color-bg-dark);
  color: var(--color-text-white);
  border: 2px solid transparent;
}

/* Override the global `.btn::before` lavender ripple — only on dark
   variants, the disc surface matches the hero cream tone instead. Same
   easing / duration / disc geometry as the default; only color is
   variant-local. The double-class `.btn.btn--dark::before` boosts the
   specificity above `.btn::before` so this rule wins regardless of where
   the two declarations sit in source order. */
.btn.btn--dark::before {
  background-color: #f9f9f7;
}

/* Hover treatment — gated to ≥992px so touch never sticks. Text flips
   from white → dark teal (now legible on the cream-filled surface) and
   the 2px border draws in dark teal so the button reads as a recessed
   outline pill. The text color uses the same `--btn-duration` / `--btn-ease`
   shared with the rest of `.btn`'s hover so all three pieces (ripple,
   text, border) finish on the same beat. The `.btn.btn--dark` selector
   matches the same specificity boost as the `::before` rule above. */
@media (min-width: 992px) {
  .btn.btn--dark:hover {
    color: var(--color-text-primary);
    border-color: var(--color-bg-dark);
  }
}

/* Outlined variant — transparent surface with a 1px border. Used by card
   CTAs ("View more" on case study cards) where the button should read as
   secondary/quiet alongside the card content. Height is locked to 3rem
   (48px) in rem so it stays constant across the fluid em scaling, just
   like the navbar `.btn--dark` override. The default hover behavior
   (lavender disc + char stagger + accent border) inherits from `.btn`. */

/* --- Premium button hover ------------------------------------------------
   One easing curve, one duration, everywhere — so the scale of the button,
   the stagger of each character, and the :active press all land in sync.
   `transform: scale()` never affects the layout box, so surrounding content
   never reflows when the button shrinks on hover.
-------------------------------------------------------------------------- */

/* Shared easing vars — everything animated on a button hover uses these,
   so the circle, the per-character stagger, and the colour/border all
   resolve on the same curve and finish on the same beat. */
.btn {
  --btn-ease: cubic-bezier(0.65, 0, 0.35, 1);   /* ease-in-out-cubic — gentle S-curve */
  --btn-duration: 800ms;                          /* per-element duration */
  transform-origin: center;
  /* NOTE: transform is intentionally NOT in this transition list. GSAP
     drives the entrance via inline transform updates per frame, and a CSS
     transform transition would lag every per-frame change by the full
     duration, dragging the visible button far behind GSAP's target.
     The :active scale below snaps without easing — a short press is brief
     enough that the lack of easing is imperceptible. */
  transition:
    color var(--btn-duration) var(--btn-ease),
    border-color var(--btn-duration) var(--btn-ease);
  will-change: transform;
}

/* Circle hover fill — a lavender disc anchored at the button's centre
   that scales 0 → 1 on hover, growing outward to cover the entire button.
   `width: 250%` + `aspect-ratio: 1/1` guarantees the circle's diameter
   exceeds the button's diagonal at any sensible aspect ratio. The button
   has `overflow: hidden`, so the excess is clipped to the rounded box.
   Duration is `--btn-duration + 100ms` so the disc finishes at the same
   beat as the last character of the text stagger (last char delay ≈
   100ms for typical ~10-char button labels at the 0.01s/char increment). */
.btn::before,
.cases__cta::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 250%;
  aspect-ratio: 1 / 1;
  background-color: var(--color-accent);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  transition: transform calc(var(--btn-duration) + 100ms) var(--btn-ease);
  pointer-events: none;
  /* Behind the label, above the button's own background: a negative z-index
     keeps the disc over the button fill but under the text WITHOUT relying on
     the `.btn__text` wrapper (the char-stagger init that injected it lived in
     the source's BaseLayout and isn't present in these standalone ports — so an
     unwrapped text node would otherwise be painted over by the growing disc). */
  z-index: -1;
}

/* Lift the button's content above the hover fill. Most buttons wrap
   their text in `.btn__text` (injected by char-stagger init); this rule
   covers any direct child element so unwrapped icons / spans also stack
   above the disc. */
.btn > * {
  position: relative;
  z-index: 1;
}

/* Hovers only apply on desktop viewports (≥992px). Touch / tablet devices
   never enter this media query, so :hover can't stick on tap. */
@media (min-width: 992px) {
  .btn:hover::before,
  .cases__cta:hover::before {
    transform: translate(-50%, -50%) scale(1);
  }

  .btn:hover,
  .cases__cta:hover {
    color: var(--color-text-primary);
    border-color: var(--color-accent);
  }
}

.btn:active,
.cases__cta:active {
  transform: scale(0.97);
}

/* ── Buttons full-width at portrait only ────────────────────────────────
   Site-wide rule: every `.btn` variant (light, dark, outline, hero, etc.)
   stretches to 100% width at portrait so it meets the 44px touch target
   AND fills the narrow viewport for clearer tap affordance. From landscape
   upward the default `width: fit-content` from the base `.btn` rule
   applies. Add new button variants by extending `.btn` — they inherit
   this behaviour for free.

   `!important` is required because Astro scoped component CSS uses
   higher-specificity selectors (e.g. `.hero__content .btn--hero` includes
   the data-astro-cid attribute, beating an unscoped `.btn`). Without it,
   any component-level `width` override on a `.btn` variant would leak
   into portrait and break the rule. The same `!important` pattern is used
   throughout the typography buckets above for the same reason. */
@media (max-width: 479px) {
  .btn {
    width: 100% !important;
    max-width: none !important;
  }
}

/* Inline text-only targets (nav links, services tabs, footer links) —
   inherit the same easing vars so their character stagger matches. Don't
   scale on hover (they're text, not buttons). */
.navbar__link {
  --btn-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --btn-duration: 500ms;
}

/* Text wrapper — uses clip-path to mask exactly the text's line box.
   Unlike overflow: hidden with padding, clip-path doesn't create extra
   visible area above/below where the outgoing/incoming chars could peek
   through. Each character still slides freely; only the pixels inside
   the current line box are painted. */

/* Each character span — `text-shadow` draws a duplicate 1.3em below
   (outside the clip). On hover the char translates up 1.3em, sliding
   out of view while the duplicate slides in from below. */

@media (min-width: 992px) {
  .btn:hover .btn__text span,
  .cases__cta:hover .btn__text span,
  .navbar__link:hover .btn__text span,
  .footer__link:hover .btn__text span {
    transform: translateY(-1.3em);
  }
}

@media (prefers-reduced-motion: reduce) {
  .btn,
  .btn::before,
  .cases__cta::before {
    transition: none;
  }
  .btn:active,
  .cases__cta:active {
    transform: none;
  }
  /* Snap the circle straight to its filled state on hover — no growth. */
  .btn:hover::before,
  .cases__cta:hover::before {
    transform: translate(-50%, -50%) scale(1);
  }
  .btn:hover .btn__text span,
  .cases__cta:hover .btn__text span,
  .navbar__link:hover .btn__text span,
  .footer__link:hover .btn__text span {
    transform: none;
  }
}

   Focus & Accessibility
   ========================================================================== */

:focus:not(:focus-visible) {
  outline: none;

.sr-only:focus {
  position: fixed;
  top: 0.5em;
  left: 0.5em;
  z-index: 9999;
  width: auto;
  height: auto;
  padding: 0.75em 1.5em;
  margin: 0;
  overflow: visible;
  clip: auto;
  white-space: normal;
  background-color: var(--color-bg-dark);
  color: var(--color-text-white);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 500;
  border-radius: var(--radius-sm);
  text-decoration: none;
}
