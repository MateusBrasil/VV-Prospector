/* ===========================================================================
   Advisora — Component styles
   Loaded last in the cascade (after webflow.css + global-styles.css).
   Only add rules here that are NEW post-Webflow migration — not overrides
   of styles that already exist in the original export.

/* ---------------------------------------------------------------------------
   Viewport visibility utilities for the navbar split
   - .is-desktop-only       → shown ≥992px, hidden below
   - .is-mobile-only        → hidden ≥992px, shown below (used by OSMO nav)
   --------------------------------------------------------------------------- */
@media (max-width: 991px) {
  .is-desktop-only { display: none !important; }
}
@media (min-width: 992px) {
  .is-mobile-only { display: none !important; }
}

/* ---------------------------------------------------------------------------
   OSMO scaling-hamburger navigation (tablet + mobile)
   Pattern: the pill lives INSIDE the navbar (absolute) so the navbar keeps
   its natural height; on activation the bg scales up to reveal the menu card
   anchored at top-right. A separate fixed sibling (.navigation__dark-bg)
   dims the page behind. State lives on <html data-navigation-status> so
   both elements (inside + outside the navbar) react together.
   Adapted from the OSMO snippet provided by the user.
   --------------------------------------------------------------------------- */

/* Anchor wrapper inside the navbar flex row — reserves 2.75em × 2.75em so the
   navbar's natural height tracks the pill, and provides the positioning
   context for the absolute .hamburger-nav inside. overflow:visible lets the
   expanded card stick out below the navbar. flex-shrink:0 prevents the
   anchor from collapsing under flex pressure. */

.hamburger-nav .hamburger-nav__a:hover .hamburger-nav__dot {
  transform: scale(1);
  opacity: 0.25;
}

.hamburger-nav__toggle:hover .hamburger-nav__toggle-bar {
  transform: translateY(0.15em);
}

.hamburger-nav__toggle:hover .hamburger-nav__toggle-bar:nth-child(2) {
  transform: translateY(-0.15em);
}

/* Mobile portrait — slightly smaller link size + tighter card padding.
   Position stays at top:0/right:0 relative to the anchor (no overrides). */

/* ---------------------------------------------------------------------------
   Button is-primary — OSMO button-009 hover pattern adapted to Advisora.
   The Webflow markup ships an <img class="button-icon"> after .button-text-wrap;
   we keep it as a real flex child (so the button auto-expands and the arrow
   never collides with the text), animate it with translate/opacity on hover,
   and add a mirrored ::before for the left arrow that slides in from the
   padding-left zone. Combined with the existing scale .975 from webflow.css:4229.
   Same timing/easing across every .button.is-primary so all CTAs feel like
   one component (one CSS rule → all instances).
   --------------------------------------------------------------------------- */
.button.is-primary {
  position: relative;
  gap: 0.5rem;
}

.button.is-primary::before {
  content: "";
  position: absolute;
  left: 1.5rem;
  top: 50%;
  width: 1.125rem;
  height: 1.125rem;
  background-image: url("https://d173woph5zl366.cloudfront.net/advisora/images/arrow-right.svg");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  translate: -1.25em -50%;
  opacity: 0;
  pointer-events: none;
  z-index: 1;
  transition: translate 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s ease-out;
}

@media (hover: hover) and (pointer: fine) {
  .button.is-primary:hover .button-icon {
    translate: 1.5em 0;
    opacity: 0;
    transition: translate 0.5s 0.05s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s 0.075s ease-out;
  }

  .button.is-primary:hover::before {
    translate: 0 -50%;
    opacity: 1;
    transition: translate 0.5s 0.075s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s 0.075s ease-out;
  }

  /* Shift text-wrap right by (icon-size + gap) so it clears the incoming
     left arrow without overlapping. */
  .button.is-primary:hover .button-text-wrap {
    translate: 1.625rem 0;
    transition: translate 0.5s 0.075s cubic-bezier(0.32, 0.72, 0, 1);
  }
}

   hovered link inherits Webflow's :hover (opacity 1, full dark).

@media (min-width: 992px) {
