  <!-- First-paint reveal guards (from BaseLayout) — hide entrance elements ONLY
       while JS is active, and ONLY when motion is allowed, so a failed script /
       reduced-motion / no-JS can never strand content. Owned + cleared by
       hero-enter.js and scroll-reveal.js. -->
  <script>
    var de = document.documentElement;
    de.classList.add('has-js');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
      de.classList.add('hero-loading');
  </script>
  <style>
    html.has-js .scroll-animation { opacity: 0; }
    html.hero-loading [bounce-enter],
    html.hero-loading .hero-two_bar-top,
    html.hero-loading .hero-two_bar-bottom,
    html.hero-loading .about_img-wrap { visibility: hidden; }
