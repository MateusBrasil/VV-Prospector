    <style data-bundled-from="/pipely/global.css">
/* ==========================================================================
   Layout tokens
   No fluid scaling: body font-size is fixed at 1rem (16px) on every breakpoint.
   Text sizes change ONLY via the bucket media queries below; paddings/gaps are rem.
   ========================================================================== */

:root {
  --container-padding: 1.5rem;  /* 24px — same across breakpoints */
  --radius-container: 20px;     /* outer section containers — desktop / tablet */
  --radius-card: 20px;          /* inner cards — desktop */
}

@media (max-width: 991px) {
  :root {
    --radius-card: 16px;        /* tablet */
  }
}

@media (max-width: 767px) {
  :root {
    --radius-container: 16px;   /* landscape — min for outer */
    --radius-card: 12px;        /* landscape */
  }
}

@media (max-width: 479px) {
  :root {
    --radius-container: 16px;   /* portrait — min */
    --radius-card: 12px;        /* portrait */
  }
}

/* ==========================================================================
   Design Tokens
   ========================================================================== */

:root {
  /* Brand & accents */
  --color-primary: #ebf213;          /* yellow button */
  --color-primary-hover: #d8df11;    /* yellow button hover (darker) */
  --color-accent: #ebf213;
  --color-button-dark: #131313;

  /* Background pastels */
  --color-bg-white: #ffffff;
  --color-bg-dark: #000000;
  --color-bg-gray-1: #f7f5f1;        /* cream */
  --color-bg-gray-2: #ede8df;        /* cream darker — inactive tab hover */
  --color-bg-purple: #e0dbff;        /* lavender */
  --color-bg-pink: #ffbdf5;
  --color-bg-yellow: #fcffa8;        /* soft yellow */
  --color-bg-soft-blue: #dae8fd;
  --color-bg-soft-green: #eefcd1;    /* used in blog rotation (3rd-from-last) */
  --color-bg-orange: #fcefd1;        /* used in blog rotation (last) */
  --color-bg-placeholder: #dedede;
  --color-bg-page: #CBC9C6;          /* between/around sections */

  /* Text */
  --color-text-primary: #000000;
  --color-text-secondary: #535353;
  --color-text-placeholder: #4e4e4e; /* form input placeholder */
  --color-text-muted: #aeaeae;       /* inactive milestone text, etc. */
  --color-error: #c0392b;            /* form field invalid + error messages */
  --color-text-white: #ffffff;
  --color-text-body-white: #bfbebe;

  /* Outline */
  --color-border: #d7d7d7;
  --color-border-dark: #2a3839;

  /* Typography */
  --font-heading: 'Host Grotesk', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;

  /* Spacing scale */
  --spacing-xs: 0.25em;   /* 4px */
  --spacing-sm: 0.5em;    /* 8px */
  --spacing-md: 1em;      /* 16px */
  --spacing-lg: 1.5em;    /* 24px */
  --spacing-xl: 2em;      /* 32px */
  --spacing-2xl: 2.5em;   /* 40px */
  --spacing-3xl: 3em;     /* 48px */
  --spacing-4xl: 3.25em;  /* 52px — section internal padding */
  --spacing-5xl: 4em;     /* 64px */
  --spacing-section-gap: 1.25em; /* 20px between sections */

  /* Border radius */
  --radius-xs: 0.25em;    /* 4px */
  --radius-sm: 0.5em;     /* 8px */
  --radius-md: 0.75em;    /* 12px */
  --radius-lg: 1.25em;    /* 20px — section card */
  --radius-pill: 2.25em;  /* 36px — social icon circle */

  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
}

/* ==========================================================================
   Reset
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  -moz-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-body);
  font-size: 1rem;            /* fixed 16px at every viewport — no fluid scaling */
  color: var(--color-text-secondary);
  background-color: var(--color-bg-page);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Tablet (≤991): tighten the horizontal gutter to 20px */
@media (max-width: 991px) {
  body { padding: 20px 20px; }
}

/* Landscape (≤767) and below: 16px gutter all around, 16px rhythm between sections */
@media (max-width: 767px) {
  body { padding: 16px; gap: 16px; }
}

img,
svg {
  display: block;
  max-width: 100%;
  height: auto;
}

a {
  color: inherit;
  text-decoration: none;
}

ul {
  list-style: none;
}


h2 {
  font-family: var(--font-heading);
  font-weight: 400;
  line-height: 1.2;
  overflow-wrap: break-word;
}

p {
  overflow-wrap: break-word;
}

/* ==========================================================================
   Typography Buckets — single source of truth
   ========================================================================== */

/* ── Bucket 68px (Hero heading) */

/* ── Bucket 60px (Section heading) */

/* ── Bucket 48px (Story heading) */
/* Per-selector letter-spacing override (Figma: -2% for blog post heading). */

/* ── Bucket 36px (Medium heading) */
.about__heading,
.stat-card__value {
  font-family: var(--font-heading) !important;
  font-weight: 400 !important;
  font-size: 2.25rem !important;
  line-height: 1.22 !important;
  letter-spacing: -0.03em !important;
}

/* ── Bucket 24px (Card title / quote) */

/* ── Author name (20px) */

/* Tablet overrides */
@media (max-width: 991px) {
  .about__heading,
  .stat-card__value {
    font-size: 2rem !important;
  }
}

/* Mobile landscape overrides */
@media (max-width: 767px) {
  .about__heading,
  .stat-card__value {
    font-size: 1.75rem !important;
    line-height: 1.2 !important;
  }
}

/* Mobile portrait overrides */
@media (max-width: 479px) {
  .about__heading,
  .stat-card__value {
    font-size: 1.5rem !important;
  }
}

/* ==========================================================================
   Base Utilities
   ========================================================================== */

.container {
  width: 100%;
  max-width: 100%;
  margin-inline: auto;
}
.container--padded {
  /* Padding is now provided by body's padding-inline. Kept as a no-op to avoid
     touching every component template. */
  padding-inline: 0;
}

/* Section eyebrow label — uppercase caption 14px / +12% tracking */
.section-label {
  font-family: var(--font-body);
  font-size: 0.875em;
  font-weight: 500;
  line-height: 1.43;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
/* Scaled caption — same shape, 20px, primary text. Used as card titles in
   service tiles where the title reads like an uppercase tag, not a heading. */

/* Button — base shared rules. Caption-style text (uppercase + tracking) like nav links. */
/* text-roll-hover (see ANIMATIONS.md). Mask = exactly one line; both text
   spans stack and translate up together on hover. */

/* ==========================================================================
   Hover gating
   ========================================================================== */

@media (min-width: 992px) and (hover: hover) and (pointer: fine) {
  .btn:hover {
    /* !important needed: GSAP entrance scripts set inline `scale: none` on
       button elements (hardware acceleration), which would otherwise win over
       this hover rule and prevent the press effect from showing. */
    scale: 0.95 !important;
  }
  .btn:hover .btn__text {
    transform: translateY(-100%);
  }
}

/* ==========================================================================
   Focus & Accessibility
   ========================================================================== */

:focus:not(:focus-visible) {
  outline: none;
}

.sr-only:focus {
  position: fixed;
  top: 0.5rem;
  left: 0.5rem;
  z-index: 9999;
  width: auto;
  height: auto;
  padding: 0.75rem 1.5rem;
  margin: 0;
  overflow: visible;
  clip: auto;
  white-space: normal;
  background-color: var(--color-bg-dark);
  color: var(--color-text-white);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 500;
  border-radius: 0.5em;
  text-decoration: none;
}

/* Portrait — buttons stretch full width */

    </style>
