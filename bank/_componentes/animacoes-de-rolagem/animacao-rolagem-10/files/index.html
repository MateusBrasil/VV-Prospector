<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three Slider Preloader</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@4.0.4/dist/tweakpane.min.js"></script>
  </head>
  <body>
    <div class="preloader">
      <div class="circle-container"></div>
      <div class="initializing-text-container">
        <div class="initializing-progress"></div>
        <div class="initializing-text">INITIALIZING</div>
      </div>
    </div>

    <footer>
      <p>DRAG TO EXPLORE</p>
    </footer>

    <div class="particles" id="particles"></div>
    <div id="titles-container"></div>
    <canvas id="canvas"></canvas>

    <script src="./script.js"></script>
  </body>
</html>
