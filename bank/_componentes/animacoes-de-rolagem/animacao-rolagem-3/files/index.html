<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacked Cards Nature</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">ÉLAN STUDIO</div>
      <div class="hint">Click anywhere</div>
    </header>

    <div class="container">
      <div class="slider">
        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80"
            alt="Mountain landscape"
          />
          <div class="copy">
            <h1>Silent Ridge</h1>
            <p>Nature study / 2026</p>
          </div>
        </article>

        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1800&q=80"
            alt="Lake and forest"
          />
          <div class="copy">
            <h1>Blue Lake</h1>
            <p>Nature study / 2026</p>
          </div>
        </article>

        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1800&q=80"
            alt="Sunset hills"
          />
          <div class="copy">
            <h1>Golden Field</h1>
            <p>Nature study / 2026</p>
          </div>
        </article>

        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1800&q=80"
            alt="Waterfall valley"
          />
          <div class="copy">
            <h1>Mist Fall</h1>
            <p>Nature study / 2026</p>
          </div>
        </article>

        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1800&q=80"
            alt="Forest road"
          />
          <div class="copy">
            <h1>Dark Pines</h1>
            <p>Nature study / 2026</p>
          </div>
        </article>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
