<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurela Loader</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
</head>
<body>
  <section class="willem-header is--loading is--hidden">
    <div class="willem-loader">
      <div class="willem__h1">
        <div class="willem__h1-start">
          <span class="willem__letter">A</span>
          <span class="willem__letter">u</span>
          <span class="willem__letter">r</span>
        </div>
        <div class="willem-loader__box">
          <div class="willem-loader__box-inner">
            <div class="willem__growing-image">
              <div class="willem__growing-image-wrap">
                <img class="willem__cover-image-extra is--1" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80" loading="eager" alt="">
                <img class="willem__cover-image-extra is--2" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1800&q=80" loading="eager" alt="">
                <img class="willem__cover-image-extra is--3" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1800&q=80" loading="eager" alt="">
                <img class="willem__cover-image" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=80" loading="eager" alt="">
              </div>
            </div>
          </div>
        </div>
        <div class="willem__h1-end">
          <span class="willem__letter">e</span>
          <span class="willem__letter">l</span>
          <span class="willem__letter">a</span>
        </div>
      </div>
    </div>

    <div class="willem-header__content">
      <div class="willem-header__top">
        <nav class="willen-nav">
          <div class="willem-nav__start">
            <span class="willem-nav__link">Aurela @</span>
          </div>
          <div class="willem-nav__end">
            <div class="willem-nav__links">
              <span class="willem-nav__link">Interiors,</span>
              <span class="willem-nav__link">Living,</span>
              <span class="willem-nav__link">Archive</span>
            </div>
            <div class="willem-nav__cta">
              <span class="willem-nav__link">Contact</span>
            </div>
          </div>
        </nav>
      </div>

      <div class="willem-header__bottom">
        <div class="willem__h1">
          <span class="willem__letter-white">A</span>
          <span class="willem__letter-white">u</span>
          <span class="willem__letter-white">r</span>
          <span class="willem__letter-white">e</span>
          <span class="willem__letter-white">l</span>
          <span class="willem__letter-white">a</span>
          <span class="willem__letter-white is--space"></span>
        </div>
        <p class="osmo-credits__p">Curated living / spatial notes</p>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
