<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efeito de Máscara</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: #222;
      background-color: #ececec;
      font-size: clamp(1rem, 2vw + 0.5rem, 2rem);
      /* font-size: 24px; */
      font-family: "Space Grotesk", sans-serif;
      
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image {
      width: 500px;
      aspect-ratio: 16/9;
      background: url(https://images.unsplash.com/photo-1472214103451-9374bd1c798e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=600) no-repeat center / cover;
      
      /* Propriedades padrão */
      mask: 
        radial-gradient(#000 70%, transparent 0),
        radial-gradient(#000 70%, transparent 0),
        radial-gradient(#000 70%, transparent 0);
      mask-repeat: no-repeat;
      mask-position: 20% 50%, 50% 50%, 80% 50%;
      mask-size: 40% 80%;
      transition: mask-position 0.5s, -webkit-mask-position 0.5s;
      
      /* Compatibilidade Webkit (Chrome/Safari) */
      -webkit-mask: 
        radial-gradient(#000 70%, transparent 0),
        radial-gradient(#000 70%, transparent 0),
        radial-gradient(#000 70%, transparent 0);
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: 20% 50%, 50% 50%, 80% 50%;
      -webkit-mask-size: 40% 80%;
      
      cursor: crosshair;
      filter: drop-shadow(2px 2px 12px #000);
    }
    
    .image:hover {
      mask-position: 10% 50%, 50% 50%, 90% 50%;
      -webkit-mask-position: 10% 50%, 50% 50%, 90% 50%;
    }
  </style>
</head>
<body>

  <div class="image"></div>

</body>
</html>
