<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orb Animation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 80%;
      height: 80%;
      /* Oculta inicialmente de acordo com o seu SVG inline */
      opacity: 0; 
    }
  </style>
</head>
<body>

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <g class="orb1">
      <image href="https://assets.codepen.io/721952/canvas-bg-orb.jpg" width="100" height="100"/>
      <g class="bg"></g>
      <circle cx="50" cy="50" r="25.5" fill="#000"/>
      <g class="fg"></g>
    </g>
  </svg>

  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- DrawSVGPlugin (necessário para animar os traços do SVG) -->
  <script src="https://assets.codepen.io/16327/DrawSVGPlugin3.min.js"></script>

  <script>
    const svg = document.querySelector('svg');
    const ns = svg.getAttribute('xmlns');
    const bg = document.querySelector('.bg');
    const fg = document.querySelector('.fg');
    const ringTLs = [];
    const n = 16;

    for (let i = 0; i < n; i++) {
      const bgRing = document.createElementNS(ns, "ellipse");
      const fgRing = document.createElementNS(ns, "ellipse");
      const r = [bgRing, fgRing];
      
      bg.prepend(bgRing);
      fg.prepend(fgRing);
      
      gsap.set(r, { attr:{ cx: 50, cy: 48, rx: 28, ry: 8, 'stroke-width': 1.25 } });
      
      ringTLs.push(
        gsap
        .timeline({ repeat: -1 })
        .fromTo(r, {
          svgOrigin: "50 50",
          drawSVG: (j) => ["-5% 50%", "50% 99%"][j],
          y: 26,
          scale: 0.1,
          opacity: 0,
          stroke: 'hsl(260,80%,8%)'
        }, {
          duration: 2,
          y: -25,
          ease: "sine.inOut"
        }, 0)
        .to(r, {
          duration: 1,
          scale: 1,
          stroke: 'hsl(190,99%,50%)',
          ease: "sine",
          repeat: 1,
          yoyo: true
        }, 0)
        .to(r, {
          duration: 0.2,
          opacity: 1,
          ease: "expo.inOut",
          repeat: 1,
          repeatDelay: 1.6,
          yoyo: true
        }, 0)
        .add(()=>{ bg.append(bgRing); fg.append(fgRing) }, 1)
        .seek(i/(n/2))
      );
    }

    gsap.fromTo('svg', {rotate: 25, opacity: 0}, {duration: 1.5, opacity: 1, ease: 'power1.inOut'});
    gsap.fromTo(ringTLs, {timeScale: 0}, {duration: 2, timeScale: 0.15, ease: 'power2.in'});

    // Interação para pausar/tocar e alterar as cores ao clicar
    window.addEventListener('pointerup', ()=>{
      gsap.to(ringTLs, {
        timeScale: (i, t) => (t.isActive() ? 0 : 0.15)
      });  
      gsap.to('svg', {
        opacity: (ringTLs[0].isActive() ? 0.5 : 1),
        filter: (ringTLs[0].isActive() ? 'grayscale(1)' : 'grayscale(0)'),
        ease: 'sine.inOut'
      });
    });
  </script>
</body>
</html>
