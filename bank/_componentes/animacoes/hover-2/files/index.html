<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Dispersion Effect — HTML CSS JS GSAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="main">
    <div class="body">
      <div class="intro-line">
        <p>Animmaster</p>
      
      </div>

      <div class="intro-line">
        <p>Design</p>
        <p>&amp;</p>
      </div>

      <div class="intro-line">
        <p>Art</p>
        <p>Direction</p>
      </div>

      <div class="intro-line intro-line--inline js-disperse" data-text="+447533063596">
        <p>+447533063596</p>
      </div>

      <div class="intro-line intro-line--inline intro-line--offset js-disperse" data-text="→Email">
        <p>→Email</p>
      </div>

      <div class="intro-line intro-line--inline js-disperse" data-text="→Insta">
        <p>→Insta</p>
      </div>
    </div>

    <div class="background" id="background"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
