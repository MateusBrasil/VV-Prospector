<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape Overlays Animation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .shape-overlays {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      cursor: pointer;
      z-index: 10;
    }

    .content {
      text-align: center;
      z-index: 1;
      pointer-events: none; /* Allows clicking through text on the overlay */
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #ff8709;
    }

    p {
      color: #888;
      font-size: 1.2rem;
    }
  </style>
  
  <!-- Importing GSAP library for animations to work -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="content">
    <h1>Fluid Animation</h1>
    <p>Click anywhere on the screen to toggle</p>
  </div>

  <!-- Provided SVG -->
  <svg class="shape-overlays" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <!-- orange crush -->
      <linearGradient id="gradient1" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#ff8709"/>
        <stop offset="100%" stop-color="#f7bdf8"/>
      </linearGradient>
      <!-- svg gradient -->
      <linearGradient id="gradient2" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#ffd9b0"/>
        <stop offset="100%" stop-color="#ff8709"/>
      </linearGradient>
    </defs>
    <path class="shape-overlays__path" fill="url(#gradient2)"></path>
    <path class="shape-overlays__path" fill="url(#gradient1)"></path>
  </svg>

  <script>
    console.clear();

    let overlay = document.querySelector(".shape-overlays");
    let paths = document.querySelectorAll(".shape-overlays__path");

    let numPoints = 10;
    let numPaths = paths.length;
    let delayPointsMax = 0.3;
    let delayPerPath = 0.25;
    let duration = 0.9;
    let isOpened = false;
    let pointsDelay = [];
    let allPoints = [];

    // GSAP Timeline
    let tl = gsap.timeline({ 
      onUpdate: render,
      defaults: {
        ease: "power2.inOut",
        duration: 0.9
      }
    });

    for (let i = 0; i < numPaths; i++) {
      let points = [];
      allPoints.push(points);
      for (let j = 0; j < numPoints; j++) {
        points.push(100);
      }
    }

    overlay.addEventListener("click", onClick);
    
    // Starts the initial render
    toggle();

    function onClick() {
      if (!tl.isActive()) {
        isOpened = !isOpened;
        toggle();
      }
    }

    function toggle() {
      tl.progress(0).clear();
      
      for (let i = 0; i < numPoints; i++) {
        pointsDelay[i] = Math.random() * delayPointsMax;
      }
      
      for (let i = 0; i < numPaths; i++) {
        let points = allPoints[i];
        let pathDelay = delayPerPath * (isOpened ? i : (numPaths - i - 1));
            
        for (let j = 0; j < numPoints; j++) {      
          let delay = pointsDelay[j];      
          tl.to(points, {
            [j]: 0
          }, delay + pathDelay);
        }
      }
    }

    function render() {
      for (let i = 0; i < numPaths; i++) {
        let path = paths[i];
        let points = allPoints[i];
        
        let d = "";
        d += isOpened ? `M 0 0 V ${points[0]} C` : `M 0 ${points[0]} C`;
        
        for (let j = 0; j < numPoints - 1; j++) {
          let p = (j + 1) / (numPoints - 1) * 100;
          let cp = p - (1 / (numPoints - 1) * 100) / 2;
          d += ` ${cp} ${points[j]} ${cp} ${points[j+1]} ${p} ${points[j+1]}`;
        }
        
        d += isOpened ? ` V 100 H 0` : ` V 0 H 0`;
        path.setAttribute("d", d);
      }  
    }
  </script>
</body>
</html>
