
<div class="main-container">
  <h1>by BL/S<span>®</span></h1>
  <div
    class="image"
    style="
      background-image: url('https://cdn.prod.website-files.com/65e61ac90950149fdb15e419/685027578326569ff9bb118d_2025-06-16%2017.16.41.jpg');
    "
  ></div>
</div>
<div class="controls">
  <div class="shape-controls">
    <button class="shape-btn active" data-shape="rectangle">1</button>
    <button class="shape-btn" data-shape="triangle">2</button>
    <button class="shape-btn" data-shape="chevron">3</button>
    <button class="shape-btn" data-shape="oval">4</button>
  </div>
  <div class="effect-controls">
    <button class="effect-btn active" data-effect="stroke">STROKE</button>
    <span>OR</span>
    <button class="effect-btn" data-effect="shade">SHADE</button>
  </div>
</div>

<div class="cursor-drag" id="cursorDrag">
  <span class="drag-text">DRAG</span>
</div>

<div class="debug-panel" id="debugPanel">
  <div class="debug-info">
    <span id="rotationInfo">rotation: 0.0</span>
    <span id="scaleInfo">scale: 1.0</span>
    <span id="edgesInfo">edges: 0.0</span>
  </div>
</div>
