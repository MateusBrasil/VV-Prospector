<style>
/* serviços — índice editorial numerado (CSS counters, zero markup extra), na passada
   do hero: kicker com ponto da marca; hover de linha com varrimento editorial
   (pseudo-elemento em scaleX a partir da esquerda — só transform, Lei M1) e a acção
   em pill que enche de amarelo por scaleY (técnica dos Buttons do Museu Triângulo,
   portada p/ CSS: o fundo é um ::before que se move, nunca background animado). */
.svcN__kicker{display:inline-flex;align-items:center;gap:.55rem;font-size:var(--step--1);font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:var(--space-2)}
.svcN__kicker svg{flex:none}
.svcN__head{margin-bottom:var(--space-4);max-width:60ch}
.svcN__head p{color:var(--ink-muted);margin-top:var(--space-2)}
.svcN__lista{list-style:none;padding:0;margin:0;border-top:1px solid var(--hairline);counter-reset:svc}
.svc__item{position:relative;border-bottom:1px solid var(--hairline);counter-increment:svc}
.svc__item::before{content:"";position:absolute;inset:0 calc(-1 * var(--space-2));border-radius:var(--radius);
  background:var(--surface);transform:scaleX(0);transform-origin:left;
  transition:transform 200ms var(--ease);pointer-events:none}
.svc__item:hover::before{transform:scaleX(1)}
.svc__link{position:relative;display:grid;gap:.25rem var(--space-3);padding-block:var(--space-3);text-decoration:none;
  grid-template-columns:auto 1fr auto;align-items:baseline}
@media (min-width:768px){.svc__link{grid-template-columns:3ch minmax(0,24ch) 1fr auto}}
.svc__link::before{content:counter(svc,decimal-leading-zero);font-size:var(--step--1);font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.05em;color:var(--brand-ink)}
.svc__link:focus-visible{outline:2px solid var(--brand-cta);outline-offset:4px}
.svc__nome{font-family:var(--font-display);font-size:var(--step-2);letter-spacing:-0.02em;line-height:1.15;color:var(--ink)}
.svc__desc{color:var(--ink-muted);font-size:var(--step-0);grid-column:2/-1}
@media (min-width:768px){.svc__desc{grid-column:3}}
.svc__seta{position:relative;isolation:isolate;overflow:clip;display:inline-flex;align-items:center;gap:.4rem;
  padding:.45rem .95rem;border:1px solid var(--hairline);border-radius:999px;
  color:var(--ink-muted);font-size:var(--step--1);font-weight:600}
.svc__seta::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--brand);
  transform:scaleY(0);transform-origin:bottom;transition:transform 200ms var(--ease)}
.svc__seta svg{transition:transform 200ms var(--ease)}
.svc__item:hover .svc__seta{color:var(--on-brand);border-color:var(--brand)}
.svc__item:hover .svc__seta::before{transform:scaleY(1)}
.svc__item:hover .svc__seta svg{transform:translateX(4px)}
</style>
<section id="servicos">
  <div class="wrap">
    <div class="svcN__head reveal">
      {{#kicker}}<p class="svcN__kicker"><svg width="6" height="6" viewBox="0 0 6 6" aria-hidden="true"><circle cx="3" cy="3" r="3" fill="currentColor"/></svg>{{kicker}}</p>{{/kicker}}
      <h2>{{titulo}}</h2>
      <p>{{intro}}</p>
    </div>
    <ul class="svcN__lista reveal">
      {{{itens}}}
    </ul>
  </div>
</section>
