<style>
.svc__head{margin-bottom:var(--space-4);max-width:60ch}
.svc__lista{list-style:none;padding:0;margin:0;border-top:1px solid var(--hairline)}
.svc__item{border-bottom:1px solid var(--hairline)}
.svc__link{display:grid;gap:.25rem var(--space-3);padding-block:var(--space-3);text-decoration:none;
  grid-template-columns:1fr auto;align-items:baseline;transition:opacity 150ms var(--ease)}
@media (min-width:768px){.svc__link{grid-template-columns:minmax(0,22ch) 1fr auto}}
.svc__link:hover{opacity:.72}
.svc__link:focus-visible{outline:2px solid var(--brand-cta);outline-offset:4px}
.svc__nome{font-family:var(--font-display);font-size:var(--step-1);letter-spacing:-0.01em}
.svc__desc{color:var(--ink-muted);font-size:var(--step-0);grid-column:1/-1}
@media (min-width:768px){.svc__desc{grid-column:2}}
.svc__seta{color:var(--ink-muted);font-size:var(--step--1)}
</style>
<section id="servicos">
  <div class="wrap">
    <div class="svc__head reveal">
      <h2>{{titulo}}</h2>
      {{#intro}}<p style="color:var(--ink-muted);margin-top:var(--space-2)">{{intro}}</p>{{/intro}}
    </div>
    <ul class="svc__lista reveal">
      {{{itens}}}
    </ul>
  </div>
</section>
