<div data-blk="secoes-localizacao-social-01">
<section class="loc-01">
  <div class="loc-01__inner">
    <div class="loc-01__col">
      <p class="loc-01__eyebrow">Localização</p>
      <h2 class="loc-01__titulo">Onde estamos</h2>
      <p class="loc-01__morada">{{MORADA}}</p>
      <p class="loc-01__horario">{{HORARIO}}</p>

      <div class="loc-01__prova">
        <span class="loc-01__nota">{{NOTA}}</span>
        <span class="loc-01__prova-txt">{{PROVA_TEXTO}}</span>
      </div>

      <div class="loc-01__contacto">
        <a class="loc-01__btn" href="{{CTA_HREF}}">{{CTA_LABEL}}</a>
        <a class="loc-01__link" href="{{EMAIL_HREF}}">{{EMAIL}}</a>
      </div>
    </div>

    <div class="loc-01__mapa">
      <iframe src="{{MAPA_SRC}}" referrerpolicy="no-referrer-when-downgrade" title="Mapa"></iframe>
    </div>
  </div>
</section>
</div>
